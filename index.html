<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Litmus</title>
<meta name="description" content="Tell Litmus what you're making. It writes the prompt in one person's taste.">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<!-- The front page of Litmus, from Noor, 12 November 2026: "how can we ask
     for these questions as easy as possible, and that has to be the first
     page". The brief from engine/brief.html, asked one question at a time.
     Easy means: tap before type (each question offers answers read from what
     you are making, and from the twenty briefs Litmus already knows), one
     question per screen, sensible defaults for everything that has one
     (never invent prices, dates or names; the shape read from your words),
     the optional parts skippable in one tap, and a review at the end where
     anything can be changed. It writes the brief to the same place as the
     full form, so "Fine-tune everything" opens it already filled in. -->
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{--ink:#14130F;--accent:#FF3E00;--quiet:#777}
  html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Nunito,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--ink)}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:22px max(20px,4vw) 0}
  .mark{font-family:Archivo,sans-serif;font-weight:900;font-size:22px;letter-spacing:-.02em;text-transform:uppercase;text-decoration:none}
  header nav{display:flex;gap:22px;font-size:15px}
  header nav a{text-decoration:none;color:var(--quiet)}
  header nav a:hover,header nav a:focus-visible{color:var(--ink)}
  main{max-width:760px;margin:0 auto;padding:7vh max(20px,4vw) 120px}
  .lead{font-size:18px;color:#444;margin:0 0 36px;max-width:36em}
  .count{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--quiet);margin:0 0 14px}
  .count .bar{flex:1;height:4px;background:#eee}
  .count .bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
  h1{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(30px,4.6vw,46px);line-height:1.04;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
  .hint{margin:0 0 26px;color:var(--quiet);font-size:16px;max-width:36em}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{font:inherit;font-size:18px;text-align:left;padding:15px 18px;min-height:56px;border:1.5px solid #cfcfcf;background:#fff;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .opt:hover{border-color:var(--ink)}
  .opt[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .opt small{font-size:13px;opacity:.6;flex:none}
  .opt:focus-visible,.next:focus-visible,.back:focus-visible,.tap:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .own{margin-top:12px}
  input[type=text],textarea,select{font:inherit;font-size:19px;width:100%;padding:15px 16px;border:1.5px solid #cfcfcf;background:#fff;color:var(--ink);border-radius:0}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink)}
  .big{font-size:24px;padding:18px 18px}
  .examples{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 0;font-size:15px;color:var(--quiet)}
  .examples button{font:inherit;font-size:15px;border:0;background:none;padding:6px 0;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
  .seen{margin:16px 0 0;font-size:15px;color:var(--quiet)}
  .seen b{color:var(--ink)}
  .kinds{display:inline-flex;flex-wrap:wrap;gap:6px;margin-left:6px;vertical-align:middle}
  .tap{font:inherit;font-size:14px;padding:6px 11px;min-height:36px;border:1.5px solid #cfcfcf;background:#fff;cursor:pointer;color:var(--ink)}
  .tap[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:10px}
  .have{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1.5px solid #cfcfcf;min-height:56px;cursor:pointer;font-size:17px;background:#fff;font-family:inherit;color:var(--ink);text-align:left}
  .have[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .have input{width:72px;font-size:16px;padding:6px 8px}
  .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin:0 0 10px}
  .pair .opt{justify-content:center;text-align:center;font-size:16px;min-height:52px;padding:10px}
  .pair .mid{font-size:14px;color:var(--quiet)}
  .opt .tick{font-size:13px;opacity:.7;flex:none}
  .sl{padding:14px 0 16px;border-bottom:1px solid #eee}
  .sl .ends{display:flex;justify-content:space-between;gap:12px;font-size:16px;font-weight:700}
  .sl input[type=range]{width:100%;margin:10px 0 4px;accent-color:var(--ink);height:28px}
  .sl.unset input[type=range]{opacity:.35}
  .sl .val{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--quiet)}
  .sl .val button{font:inherit;font-size:13px;border:0;background:none;color:var(--quiet);text-decoration:underline;cursor:pointer;padding:2px}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px}
  .gal.big{grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr))}
  .pic{position:relative;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
  .pic img{width:100%;aspect-ratio:8/5;object-fit:cover;display:block;background:#f2f2f2;outline:2px solid transparent;outline-offset:2px}
  .gal:not(.big) .pic img{aspect-ratio:1}
  .pic span{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pic[aria-pressed="true"] img{outline:3px solid var(--accent)}
  .pic[aria-pressed="true"]::after{content:"\2713";position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;display:grid;place-items:center}
  .pic:focus-visible img{outline:3px solid var(--ink)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
  .card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--ink);background:#fff;border:1.5px solid #e2e2e2;padding:0 0 14px;cursor:pointer}
  .card img{width:100%;aspect-ratio:8/5;object-fit:cover;display:block;background:#f2f2f2}
  .card .ctag,.card b,.card .cwhat,.card .ctake{padding:0 14px}
  .card .ctag{margin-top:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .card b{font-size:17px;line-height:1.25}
  .card .cwhat{font-size:14px;color:#555;line-height:1.4}
  .card .ctake{font-size:14px;line-height:1.4}
  .card .ctake span{display:block;padding:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet);font-weight:700;margin:4px 0 2px}
  .card:hover{border-color:#999}
  .card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .card[aria-pressed="true"]::after{content:"\2713";position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;display:grid;place-items:center}
  .card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .drop{border:2px dashed #cfcfcf;padding:20px;text-align:center;color:var(--quiet);cursor:pointer;margin:0 0 12px}
  .drop.over{border-color:var(--ink);color:var(--ink)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
  .thumbs img{width:84px;height:84px;object-fit:cover;display:block}
  .sub{font-weight:700;font-size:16px;margin:26px 0 10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:34px}
  .next{font:inherit;font-weight:700;font-size:18px;padding:15px 30px;min-height:56px;border:0;background:var(--ink);color:#fff;cursor:pointer}
  .next[disabled]{background:#e6e6e6;color:#999;cursor:not-allowed}
  .back,.skip{font:inherit;font-size:16px;border:0;background:none;color:var(--quiet);cursor:pointer;padding:10px 4px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
  .keys{font-size:13px;color:#aaa}
  /* review */
  .rv{display:grid;grid-template-columns:190px minmax(0,1fr) auto;gap:6px 18px;align-items:baseline;padding:12px 0;border-bottom:1px solid #eee;font-size:16px}
  .rv dt{color:var(--quiet);font-size:14px}
  .rv dd{margin:0}
  .rv button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
  .made{margin:30px 0 0;display:flex;flex-direction:column;gap:10px}
  pre{font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;margin:24px 0 0;border:1.5px solid var(--ink);padding:18px;max-height:60vh;overflow:auto}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0}
  .ghost{font:inherit;font-size:16px;padding:13px 20px;min-height:52px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
  .note{font-size:14px;color:var(--quiet);margin:10px 0 0}
  @media (max-width:640px){ .rv{grid-template-columns:1fr auto} .rv dt{grid-column:1 / -1} main{padding-top:5vh} .pair{grid-template-columns:1fr 1fr} .pair .mid{grid-column:1 / -1;order:3} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header><a class="mark" href="./">Litmus</a>
  <nav aria-label="Elsewhere"><a href="about.html">About</a><a href="engine/">The engine</a><a href="made/round-3/">The work</a></nav></header>
<main id="main" aria-live="polite"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="engine/data.js"></script>
<script src="engine/references.js"></script>
<script src="engine/palette.js"></script>
<script src="engine/profile.js"></script>
<script src="engine/site.js"></script>
<script src="engine/structure.js"></script>
<script src="engine/compare.js"></script>
<script src="engine/constructs.js"></script>
<script src="engine/people.js"></script>
<script src="engine/brief-core.js"></script>
<script>
/* ---------- the brief, shared with the full form ---------- */
const KEY = 'litmus-brief-v1';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ S = {}; }
const fresh = () => ({ never:['prices', 'opening hours', 'names', 'numbers', 'dates', 'addresses', 'quotes or reviews'], fileRefs:[], shape:{}, scales:{}, images:[], output:'prompt', tool:'Claude Code', device:'both equally' });
S = Object.assign(fresh(), S); normalizeScales(); if (S.action && !(S.actions || []).length) S.actions = [S.action];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let db = null;
const dbReady = new Promise((res) => { try { const r = indexedDB.open('litmus-brief', 1); r.onupgradeneeded = () => r.result.createObjectStore('images'); r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => res(); } catch(e){ res(); } });
const putImg = (id, blob) => dbReady.then(() => db && new Promise((res) => { const t = db.transaction('images', 'readwrite'); t.objectStore('images').put(blob, id); t.oncomplete = res; t.onerror = res; }));
const getImg = (id) => dbReady.then(() => db ? new Promise((res) => { const q = db.transaction('images').objectStore('images').get(id); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }) : null);

/* ---------- suggestions: read from what you are making ---------- */
const CATS = [
  { test:/\b(restaurant|caf[eé]|bakery|menu|chef|bar|kitchen|pizzeria|dinner|lunch|brunch|bistro|supper|food)\b/i,
    who:['People deciding where to eat', 'Locals deciding whether to go now', 'Someone planning a special night'],
    job:['See what they would eat and what it costs', 'Book a table', 'Know if it is open now and what is left'],
    says:['A short menu that follows the season', 'What is on the counter right now', 'Cooked by the people you can see from the door'],
    peak:['The dishes arriving one after another', 'Seeing what is left right now'], act:'book' },
  { test:/\b(band|duo|trio|gig|album|ep|label|musician|singer|dj|concert|songs?|records?)\b/i,
    who:['Fans', 'Curious locals who have not heard them yet', 'Promoters deciding whether to book them'],
    job:['Hear them', 'Find the next show and get a ticket', 'Buy the record'],
    says:['You have to hear this in a room', 'Small runs, every record pressed by hand'],
    peak:['Hearing them', 'Flicking through the records'], act:'tickets' },
  { test:/\b(festival|exhibition|launch|opening|screening|season|conference|fair|talk|event|programme|program)\b/i,
    who:['Locals choosing a night out', 'People who came last year', 'Someone who heard about it from a friend'],
    job:['See what is on and when', 'Get a ticket or a seat', 'Know where it is and how to get there'],
    says:['A week of things worth leaving the house for', 'One night, and why it matters'],
    peak:['Choosing their night', 'Seeing it before they go'], act:'tickets' },
  { test:/\b(shop|store|boutique|wine|bookshop|bookstore|deli|grocer|stall|florist|flowers)\b/i,
    who:['People nearby deciding whether to come in', 'Regulars checking what is new', 'Someone looking for a present'],
    job:['See what is in and what it costs', 'Know when it is open and where it is', 'Find one thing they will like without knowing the names'],
    says:['Everything here is chosen by someone who will tell you plainly what it is like', 'Small, picked by hand, changing every week'],
    peak:['Picking something up and looking at it closely', 'Seeing what came in this week'], act:'visit' },
  { test:/\b(ceramics?|pots?|pottery|furniture|jewel(le)?ry|handmade|craft|textiles?|candles?|objects)\b/i,
    who:['People buying something to keep', 'Someone buying a present', 'Shops looking for stock'],
    job:['See the pieces and what they cost', 'Order one', 'Know how long it takes'],
    says:['Every piece is made by hand, to order', 'Made here, in small numbers'],
    peak:['Seeing how a piece is made', 'Shaping or choosing their own'], act:'buy' },
  { test:/\b(repair|tattoo|salon|barber|clinic|workshop|lessons?|class(es)?|teacher|therapist|coach|tailor)\b/i,
    who:['People with something to fix or change', 'Regulars', 'Someone who has never been before'],
    job:['Know what it costs', 'Book a time', 'Know where to go and when'],
    says:['You know the price before we start', 'Done properly, by the person you will meet'],
    peak:['Seeing the work being done', 'Trying it themselves'], act:'book' },
  { test:/\b(portfolio|photographer|artist|designer|illustrator|architects?|architecture|practice|director|filmmaker|painter)\b/i,
    who:['People deciding whether to hire them', 'Editors and art directors', 'Other artists and students'],
    job:['Judge the work quickly', 'See the range', 'Get in touch'],
    says:['How they see, and what they keep', 'The work, and the thinking behind it'],
    peak:['Seeing a piece up close', 'Watching a piece come together'], act:'contact' },
  { test:/\b(guide|city|travel|weekend|map|tour|walk|itinerary|neighbou?rhood|trip)\b/i,
    who:['Someone planning a trip', 'Locals looking for somewhere new', 'A friend visiting for a weekend'],
    job:['A plan they can follow', 'Know where to go and when', 'Find places they would not find alone'],
    says:['The city the way the people who live there spend a day', 'One walk, start to finish'],
    peak:['Moving through the day', 'Seeing the route on the ground'], act:'visit' },
  { test:/\b(museum|archive|collection|history|heritage|gallery|library)\b/i,
    who:['People planning a visit', 'Researchers and students', 'Someone who loves the subject'],
    job:['See what is in it', 'Find one thing', 'Plan a visit'],
    says:['Things from the stores, brought into the light', 'Years of work, in order'],
    peak:['Finding one thing and looking closely', 'Walking through it in order'], act:'visit' },
  { test:/\b(magazine|zine|newsletter|journal|podcast|book|press|publisher|blog|writing|essays?)\b/i,
    who:['Readers', 'Listeners', 'People who came for one piece'],
    job:['See what is in it', 'Read or listen', 'Subscribe or buy a copy'],
    says:['An issue about one thing, from every side', 'Something to read slowly'],
    peak:['Opening it up', 'The first page or the first minute'], act:'read' },
  { test:/\b(app|tool|software|startup|product|typeface|font|platform|device)\b/i,
    who:['People who have the problem it solves', 'Designers', 'Teams choosing between options'],
    job:['Understand what it does', 'Try it', 'Buy it or sign up'],
    says:['One thing, done properly', 'Try it before you read about it'],
    peak:['Trying it with their own words or data', 'Seeing it work'], act:'sign up' }
];
const GENERIC = { who:['People who already know you', 'People who have never heard of you'], job:['Find out what it is', 'Get in touch'], says:[], peak:['Something they can play with', 'Seeing the thing itself, up close'], act:'contact' };
/* the twenty briefs Litmus already knows, matched by their words */
const KNOWN = { '01':/\bwine\b/i, '02':/\b(tasting|chef)\b/i, '03':/\b(gig|duo|band)\b/i, '04':/\bphotograph/i, '05':/\b(weekend|city guide)\b/i, '06':/\barchive\b/i, '07':/\barchitect/i, '08':/\b(small press|bookshop|bookstore)\b/i,
  '09':/\b(ceramic|pots?|pottery)\b/i, '10':/\b(film|cinema)\b/i, '11':/\b(record label|label)\b/i, '12':/\bmagazine\b/i, '13':/\b(florist|flowers)\b/i, '14':/\bdance\b/i, '15':/\b(museum|exhibition)\b/i, '16':/\b(bakery|bread)\b/i,
  '17':/\b(typeface|font|foundry)\b/i, '18':/\btattoo\b/i, '19':/\b(bike|bicycle|cycle)\b/i, '20':/\b(podcast|sleep)\b/i };
function catOf(){ return CATS.find((c) => c.test.test(S.what || '')) || GENERIC; }
function known(){ const k = Object.keys(KNOWN).find((k) => KNOWN[k].test(S.what || '')); return k ? NARRATIVES[k] : null; }
function sugg(field){
  const C = catOf(), K = known(), out = [];
  const from = { who:K && K.who, job:K && K.job, says:K && K.says, peak:K && K.peak };
  if (from[field]) out.push(from[field].replace(/\.$/, ''));
  (C[field] || []).forEach((x) => { if (!out.includes(x)) out.push(x); });
  if (C !== GENERIC) (GENERIC[field] || []).slice(0, 1).forEach((x) => { if (!out.includes(x)) out.push(x); });
  return out.slice(0, 4);
}
function kindOf(t){ return /\bposter\b|\bflyer\b/i.test(t) ? 'poster' : /\bdeck\b|\bslides?\b|\bpitch\b/i.test(t) ? 'deck' : /\bapp screen\b|\bscreen\b|\bapp\b/i.test(t) ? 'app screen' : /\bsingle page\b|\blanding page\b|\bone page\b/i.test(t) ? 'single page' : 'website'; }

const ACTIONS = [['buy', 'Buy something'], ['book', 'Book a table or a time'], ['tickets', 'Get a ticket'], ['contact', 'Get in touch'], ['visit', 'Come in or visit'], ['listen', 'Listen'], ['read', 'Read it'], ['sign up', 'Sign up']];
const HAVES = [['photos', 'Photos', true], ['prices', 'Prices'], ['dates', 'Dates or a programme'], ['hours', 'Opening hours'], ['words', 'Words, written already'], ['logo', 'A logo'], ['music', 'Music or sound'], ['products', 'Things to sell', true]];
const FEEL = ['order', 'volume', 'image', 'world', 'surface', 'colour', 'words', 'motion'];

/* ---------- the steps ---------- */
const STEPS = ['what', 'who', 'job', 'says', 'end', 'peak', 'have', 'show', 'feel', 'review'];
const REQUIRED = { what:() => (S.what || '').trim().length > 2, who:() => !!(S.who || '').trim(), job:() => !!(S.job || '').trim(), says:() => !!(S.says || '').trim(), end:() => !!(S.actions && S.actions.length), peak:() => !!(S.peak || '').trim() };
let at = Math.min(+(S._step || 0), STEPS.length - 1);
const main = document.getElementById('main');
const esc = (t) => String(t || '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);

function head(n, q, hint){
  const total = 6, shown = Math.min(n, total);
  return '<div class="count">' + (n <= total ? '<span>' + shown + ' of ' + total + '</span>' : '<span>Optional</span>') + '<div class="bar"><i style="width:' + (Math.min(n, total) / total * 100) + '%"></i></div></div>' +
    '<h1>' + q + '</h1>' + (hint ? '<p class="hint">' + hint + '</p>' : '');
}
function foot(opt){
  return '<div class="foot">' + (at > 0 ? '<button class="back" data-go="back">Back</button>' : '<span></span>') +
    '<div style="display:flex;gap:18px;align-items:center">' + (opt ? '<button class="skip" data-go="next">Skip</button>' : '') + '<button class="next" data-go="next"' + (REQUIRED[STEPS[at]] && !REQUIRED[STEPS[at]]() ? ' disabled' : '') + '>Next</button></div></div>' +
    '<p class="keys">Press Enter to go on.</p>';
}
/* who, what for and the moment take several answers; the sentence takes one */
const MULTI = { who:1, job:1, peak:1 };
function joinField(f){ const p = S[f + 'Picks'] || [], o = (S[f + 'Own'] || '').trim(); S[f] = p.concat(o ? [o] : []).join('; '); }
function picker(field, q, hint){
  const opts = sugg(field), multi = !!MULTI[field], picks = multi ? (S[field + 'Picks'] || []) : [S[field]];
  const own = multi ? (S[field + 'Own'] || '') : (S[field] && !opts.includes(S[field]) ? S[field] : '');
  return head(at + 1, q, hint + (multi ? ' Pick any that fit.' : '')) + '<div class="opts">' + opts.map((o) => '<button class="opt" data-pick="' + field + '" data-v="' + esc(o) + '" aria-pressed="' + picks.includes(o) + '">' + esc(o) + (multi ? '<span class="tick">' + (picks.includes(o) ? 'picked' : '') + '</span>' : '') + '</button>').join('') + '</div>' +
    '<div class="own"><input type="text" data-own="' + field + '" placeholder="' + (multi ? 'Add your own' : 'Or say it your way') + '" value="' + esc(own) + '"></div>' + foot();
}
function render(){
  S._step = at; save();
  const st = STEPS[at]; let h = '';
  if (st === 'what'){
    h = '<p class="lead">Litmus makes things in one person’s taste. Six questions, most of them one tap, and it writes the prompt.</p>' +
      head(1, 'What are you making?', 'A line is enough. Who it’s for and what it is.') +
      '<input type="text" class="big" data-own="what" placeholder="A site for my bakery in Leith" value="' + esc(S.what) + '" autofocus>' +
      '<div class="examples"><span>For example</span><button data-ex="A site for a cello and synth duo">A site for a cello and synth duo</button><button data-ex="A photographer’s portfolio">A photographer’s portfolio</button><button data-ex="A poster for a film night">A poster for a film night</button></div>' +
      '<p class="seen" id="seen"></p>' + foot();
  }
  const sheet = !(FORMATS[S.kind] || FORMATS.website).web, unit = (FORMATS[S.kind] || FORMATS.website).unit;
  if (st === 'who') h = sheet ? picker('who', 'Who sees it?', 'The person it has to reach, not the person paying for it.') : picker('who', 'Who comes to it?', 'The person who actually visits, not the person paying for it.');
  if (st === 'job') h = sheet ? picker('job', 'What do they need from it?', 'In their words, what they look for in it.') : picker('job', 'What do they come to do?', 'In their words, the reason they opened it.');
  if (st === 'says') h = picker('says', 'If they remember one sentence, what is it?', 'Everything else is built around this.');
  if (st === 'end'){ const A = S.actions || [];
    h = head(at + 1, sheet ? 'What should they do after seeing it?' : 'What should they do before they leave?', sheet ? 'Pick any. The first one you tap is the main one, and what they need for it goes on the ' + unit + '.' : 'Pick any. The first one you tap is the main one, and every ' + unit + ' ends on it.') + '<div class="opts">' + ACTIONS.map((a) => '<button class="opt" data-act="' + a[0] + '" aria-pressed="' + A.includes(a[0]) + '">' + a[1] + '<span class="tick">' + (A[0] === a[0] ? 'the main one' : A.includes(a[0]) ? 'picked' : '') + '</span></button>').join('') + '</div>' + foot(); }
  if (st === 'peak') h = picker('peak', 'What will they remember?', 'The one moment. Usually the thing they can do on it.');
  if (st === 'have'){
    const H = S.has || {};
    h = head(7, 'What do you have already?', 'Tap what exists. Litmus never makes up prices, dates, names or numbers; it leaves a marked gap instead.') +
      '<div class="grid2">' + HAVES.map((x) => '<div class="have" role="button" tabindex="0" data-have="' + x[0] + '" aria-pressed="' + (H[x[0]] !== undefined) + '"><span>' + x[1] + '</span>' + (x[2] ? '<input type="text" inputmode="numeric" placeholder="how many" data-n="' + x[0] + '" value="' + esc(H[x[0]] || '') + '" aria-label="How many ' + x[1].toLowerCase() + '">' : '') + '</div>').join('') +
      '<div class="have" role="button" tabindex="0" data-have="none" aria-pressed="' + (!!S.hasNothing) + '"><span>Nothing yet</span></div></div>' + foot(true);
  }
  if (st === 'show'){
    h = head(8, 'Anything to show it?', 'Your own pictures to use, and work you love. Skip if not.') +
      '<div class="drop" id="drop" tabindex="0" role="button">Drop pictures here, or tap to choose</div><input type="file" id="files" accept="image/*" multiple hidden><div class="thumbs" id="thumbs"></div>' +
      '<p class="sub">Work you love. Tap any. Each says what Litmus would take from it.</p><div class="cards">' + PICKS.map((p) => card(p, '')).join('') + '</div>' +
      '<p class="sub">Or name one, and why</p><input type="text" data-own="ref1" placeholder="A site, a book, a poster" value="' + esc(S.ref1) + '"><input type="text" data-own="ref1why" placeholder="Why, in a sentence" value="' + esc(S.ref1why) + '" style="margin-top:8px">' + foot(true);
  }
  if (st === 'feel'){
    const row = (s) => { const v = S.scales[s[0]], set = v !== undefined && v !== null;
      return '<div class="sl' + (set ? '' : ' unset') + '" data-sl="' + s[0] + '"><div class="ends"><span>' + s[1] + '</span><span>' + s[2] + '</span></div>' +
        '<input type="range" min="0" max="100" step="1" value="' + (set ? v : 50) + '" aria-label="' + esc(s[1] + ' to ' + s[2]) + '" aria-valuetext="' + (set ? esc(scalePhrase(s, v)) : 'Litmus decides') + '">' +
        '<div class="val"><span>' + (set ? esc(scalePhrase(s, v)) + ', ' + v : 'Litmus decides') + '</span>' + (set ? '<button data-unset="' + s[0] + '">Leave it to Litmus</button>' : '') + '</div></div>'; };
    h = head(9, 'How should it feel?', 'Drag only the ones you care about. Anything left alone is Litmus\u2019s call.') +
      FEEL.map((k) => row(SCALES.find((s) => s[0] === k))).join('') +
      '<p class="sub">How the words should sound</p>' + SCALES.filter((s) => s[3] === 'tone').map(row).join('') + foot(true);
  }
  if (st === 'review'){
    deriveRest();
    const act = (S.actions || []).map((a) => ACTION_LABELS[a]).join(', then '), P = pickStructure(), nScales = Object.keys(S.scales).length, nRefs = (S.picks || []).length;
    const rows = [['What', S.what, 0], ['Who comes', S.who, 1], ['They come to', S.job, 2], ['It says', S.says, 3], ['Before they leave', act, 4], ['They remember', S.peak, 5], ['You have', S.exists, 6], ['References', nRefs ? nRefs + ' picked' : 'none', 7], ['Feel and tone', nScales ? nScales + ' set, the rest left to Litmus' : 'left to Litmus', 8]];
    h = '<div class="count"><span>Ready</span><div class="bar"><i style="width:100%"></i></div></div><h1>Here’s the brief.</h1><p class="hint">Change anything, then write it.</p><dl>' +
      rows.map((r) => '<div class="rv"><dt>' + r[0] + '</dt><dd>' + esc(r[1] || 'not yet') + '</dd><button data-jump="' + r[2] + '">Change</button></div>').join('') +
      '<div class="rv"><dt>Shape</dt><dd>' + (P ? P.name + ', read from your words' : 'Nothing fits yet') + '</dd><a href="engine/brief.html" style="font-size:14px">Fine-tune</a></div></dl>' +
      '<div class="made"><p class="sub" style="margin:10px 0 0">What should Litmus write?</p><div class="row"><button class="tap" data-out="prompt" aria-pressed="' + (S.output !== 'skill') + '">A prompt, to paste once</button><button class="tap" data-out="skill" aria-pressed="' + (S.output === 'skill') + '">A skill, for a project folder</button></div>' +
      '<label class="sub" for="tool" style="display:block">For</label><select id="tool">' + ['Claude Code', 'Claude.ai', 'Cursor', 'v0', 'Lovable', 'Figma Make', 'Other'].map((t) => '<option' + (S.tool === t ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></div>' +
      '<div class="foot"><button class="back" data-go="back">Back</button><button class="next" id="write">Write it</button></div>' +
      '<div id="result" hidden><pre id="text"></pre><div class="btns"><button class="next" id="copy">Copy</button><button class="ghost" id="dl">Download</button></div><p class="note" id="rnote"></p></div>' +
      '<p class="note" style="margin-top:28px"><a href="engine/brief.html">Fine-tune everything in the full form</a> &nbsp; <button class="back" id="restart" style="padding:0">Start a new brief</button></p>';
  }
  main.innerHTML = h;
  wire(st);
  const f = main.querySelector('[autofocus], input[data-own]'); if (f && st === 'what') f.focus();
  if (st === 'what') seen();
  if (st === 'show') drawThumbs();
}
function card(p, base){
  return '<button class="card" data-pk="' + p.id + '" aria-pressed="' + (S.picks || []).includes(p.id) + '"><img loading="lazy" src="' + base + p.img + '" alt="">' +
    '<span class="ctag">' + esc(p.tag) + '</span><b>' + esc(p.name) + '</b><span class="cwhat">' + esc(p.what) + '</span><span class="ctake"><span>Litmus takes</span>' + esc(p.takes) + '</span></button>';
}
function seen(){
  const el = document.getElementById('seen'); if (!el) return;
  if ((S.what || '').trim().length < 3){ el.innerHTML = ''; return; }
  const K = ['website', 'single page', 'poster', 'deck', 'app screen'];
  el.innerHTML = 'Making a <b>' + S.kind + '</b>. <span class="kinds">' + K.filter((k) => k !== S.kind).map((k) => '<button class="tap" data-kind="' + k + '">' + k + '</button>').join('') + '</span>';
  el.querySelectorAll('[data-kind]').forEach((b) => b.onclick = () => { S.kind = b.dataset.kind; S.kindSet = true; save(); seen(); });
}
/* everything that can be worked out is worked out, and shown at the review */
function deriveRest(){
  const act = ACTION_LABELS[(S.actions || [])[0]] || 'Get in touch';
  S.end = act; S.first = 'What it is, who it is for, and how to ' + act.charAt(0).toLowerCase() + act.slice(1);
  const H = S.has || {}, parts = HAVES.filter((x) => H[x[0]] !== undefined).map((x) => (H[x[0]] ? H[x[0]] + ' ' : '') + x[1].toLowerCase());
  S.exists = S.hasNothing ? 'Nothing yet. Leave marked gaps.' : parts.length ? parts.join(', ') : '';
  const text = [S.what, S.says, S.job, S.exists].filter(Boolean).join('. '), r = readShape(text);
  SHAPE.forEach((q) => { if (!S.shape[q.id] || S.shape[q.id].auto) S.shape[q.id] = { v:!!r.found[q.id], auto:true, word:r.words[q.id] || '' }; });
  save();
}
function wire(st){
  main.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go(b.dataset.go === 'next' ? 1 : -1));
  main.querySelectorAll('[data-own]').forEach((i) => i.oninput = () => {
    if (MULTI[i.dataset.own]){ S[i.dataset.own + 'Own'] = i.value; joinField(i.dataset.own); save(); refreshNext(); return; }
    S[i.dataset.own] = i.value;
    if (i.dataset.own === 'what' && !S.kindSet) S.kind = kindOf(i.value);
    main.querySelectorAll('[data-pick="' + i.dataset.own + '"]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    save(); refreshNext(); if (i.dataset.own === 'what') seen();
  });
  main.querySelectorAll('[data-ex]').forEach((b) => b.onclick = () => { S.what = b.dataset.ex; S.kind = kindOf(S.what); save(); render(); });
  main.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => { const f = b.dataset.pick;
    if (!MULTI[f]){ S[f] = b.dataset.v; save(); go(1); return; }
    const p = S[f + 'Picks'] || []; S[f + 'Picks'] = p.includes(b.dataset.v) ? p.filter((x) => x !== b.dataset.v) : p.concat(b.dataset.v); joinField(f); save();
    b.setAttribute('aria-pressed', S[f + 'Picks'].includes(b.dataset.v)); b.querySelector('.tick').textContent = S[f + 'Picks'].includes(b.dataset.v) ? 'picked' : ''; refreshNext(); });
  main.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => { const A = S.actions || [], k = b.dataset.act;
    S.actions = A.includes(k) ? A.filter((x) => x !== k) : A.concat(k); S.action = S.actions[0] || ''; save(); render(); });
  main.querySelectorAll('[data-pk]').forEach((b) => b.onclick = () => { const k = b.dataset.pk, p = S.picks || []; S.picks = p.includes(k) ? p.filter((x) => x !== k) : p.concat(k); save(); b.setAttribute('aria-pressed', S.picks.includes(k)); });
  main.querySelectorAll('[data-rp]').forEach((b) => b.onclick = () => { const k = b.dataset.rp, p = S.refPicks || []; S.refPicks = p.includes(k) ? p.filter((x) => x !== k) : p.concat(k); save(); b.setAttribute('aria-pressed', S.refPicks.includes(k)); });
  main.querySelectorAll('[data-sl] input').forEach((r) => r.oninput = () => { const box = r.closest('[data-sl]'), s = SCALES.find((x) => x[0] === box.dataset.sl), v = +r.value;
    S.scales[s[0]] = v; save(); box.classList.remove('unset'); r.setAttribute('aria-valuetext', scalePhrase(s, v));
    box.querySelector('.val').innerHTML = '<span>' + esc(scalePhrase(s, v)) + ', ' + v + '</span><button data-unset="' + s[0] + '">Leave it to Litmus</button>';
    box.querySelector('[data-unset]').onclick = () => { delete S.scales[s[0]]; save(); render(); }; });
  main.querySelectorAll('[data-unset]').forEach((b) => b.onclick = () => { delete S.scales[b.dataset.unset]; save(); render(); });
  main.querySelectorAll('[data-have]').forEach((b) => {
    const toggle = (e) => { if (e && e.target.tagName === 'INPUT') return; S.has = S.has || {};
      if (b.dataset.have === 'none'){ S.hasNothing = !S.hasNothing; if (S.hasNothing) S.has = {}; }
      else { S.hasNothing = false; if (S.has[b.dataset.have] !== undefined) delete S.has[b.dataset.have]; else S.has[b.dataset.have] = ''; }
      save(); render(); };
    b.onclick = toggle; b.onkeydown = (e) => { if ((e.key === ' ' || e.key === 'Enter') && e.target === b){ e.preventDefault(); toggle(); } };
  });
  main.querySelectorAll('[data-n]').forEach((i) => i.oninput = () => { S.has = S.has || {}; S.has[i.dataset.n] = i.value.replace(/[^0-9]/g, ''); S.hasNothing = false; i.closest('.have').setAttribute('aria-pressed', 'true'); save(); });
  main.querySelectorAll('[data-ref]').forEach((b) => b.onclick = () => { const k = b.dataset.ref; S.fileRefs = S.fileRefs.includes(k) ? S.fileRefs.filter((x) => x !== k) : S.fileRefs.concat(k); save(); b.setAttribute('aria-pressed', S.fileRefs.includes(k)); });
  main.querySelectorAll('[data-jump]').forEach((b) => b.onclick = () => { at = +b.dataset.jump; render(); });
  main.querySelectorAll('[data-out]').forEach((b) => b.onclick = () => { S.output = b.dataset.out; save(); main.querySelectorAll('[data-out]').forEach((x) => x.setAttribute('aria-pressed', x === b)); });
  const tool = document.getElementById('tool'); if (tool) tool.onchange = () => { S.tool = tool.value; save(); };
  if (st === 'show'){
    const drop = document.getElementById('drop'), files = document.getElementById('files');
    drop.onclick = () => files.click(); drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); files.click(); } };
    ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files)); files.onchange = () => { addFiles(files.files); files.value = ''; };
  }
  if (st === 'review'){
    document.getElementById('write').onclick = write;
    document.getElementById('restart').onclick = (e) => { const b = e.currentTarget; if (b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Tap again to clear it'; return; } S = fresh(); at = 0; save(); render(); };
  }
}
function refreshNext(){ const n = main.querySelector('.next[data-go="next"]'); if (n && REQUIRED[STEPS[at]]) n.disabled = !REQUIRED[STEPS[at]](); }
function go(d){
  if (d > 0 && REQUIRED[STEPS[at]] && !REQUIRED[STEPS[at]]()) return;
  if (STEPS[at] === 'what' && !S.kind) S.kind = kindOf(S.what || '');
  at = Math.max(0, Math.min(STEPS.length - 1, at + d)); render(); scrollTo(0, 0);
}
addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'TEXTAREA' && STEPS[at] !== 'review'){ e.preventDefault(); go(1); } });
function addFiles(list){
  [...list].filter((f) => f.type.startsWith('image/')).forEach((f) => { const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    S.images.push({ id, name:f.name, role:'ours', why:'' }); putImg(id, f).then(() => { save(); drawThumbs(); }); });
}
function drawThumbs(){
  const t = document.getElementById('thumbs'); if (!t) return; t.innerHTML = '';
  S.images.forEach((m) => { const im = document.createElement('img'); im.alt = m.name; getImg(m.id).then((b) => { if (b) im.src = URL.createObjectURL(b); }); t.appendChild(im); });
}
/* ---------- writing it ---------- */
function saveAs(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function write(){
  deriveRest(); if (!S.kind) S.kind = kindOf(S.what || '');
  const skill = S.output === 'skill', text = skill ? skillMd() : compose(), box = document.getElementById('result');
  box.hidden = false; document.getElementById('text').textContent = text;
  document.getElementById('dl').textContent = skill ? 'Download the skill' : (S.images.length ? 'Download with the pictures' : 'Download');
  document.getElementById('rnote').textContent = skill ? 'Unzip it into .claude/skills/ in your project, or upload the zip as a skill in Claude.ai.' : 'Paste it into ' + S.tool + (S.images.length ? ' with the pictures.' : '.');
  document.getElementById('copy').onclick = (e) => { const b = e.currentTarget; navigator.clipboard.writeText(text).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1600); }).catch(() => { const r = document.createRange(); r.selectNodeContents(document.getElementById('text')); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Selected, copy it'; }); };
  document.getElementById('dl').onclick = async () => {
    if (!skill && !S.images.length && !(S.picks || []).length){ saveAs(new Blob([text], { type:'text/markdown' }), 'litmus-' + slug() + '.md'); return; }
    const z = new JSZip(), root = skill ? z.folder('litmus-' + slug()) : z;
    root.file(skill ? 'SKILL.md' : 'prompt.md', text); if (skill) root.file('brief.json', JSON.stringify(S, null, 2));
    for (const m of S.images){ const b = await getImg(m.id); if (b) root.folder('assets').file(m.name, b); }
    for (const p of PICKS.filter((x) => (S.picks || []).includes(x.id))){ try { const b = await (await fetch(p.img)).blob(); root.folder('assets').folder('references').file(p.id + '.jpg', b); } catch(e){} }
    saveAs(await z.generateAsync({ type:'blob' }), 'litmus-' + slug() + (skill ? '-skill' : '') + '.zip');
  };
  box.scrollIntoView({ behavior:'smooth', block:'start' });
}
render();
</script>
</body>
</html>
