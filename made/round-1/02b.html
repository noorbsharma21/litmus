<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arda</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
<!-- 02b. A chef's eight course tasting menu. Axis: worlds. This one: several
     worlds. All eight plates on one sheet at once, each its own small world,
     and every plate leans its food toward the pointer. Same courses, palette
     and type as 02a. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#3866C1;font-family:"IM Fell English",serif;color:#fff}
h1{margin:0;font-weight:normal;font-size:44px}
header{position:fixed;left:24px;top:14px}
p.when{margin:4px 0 0;font-size:19px}
#sheet{position:fixed;left:3vw;right:3vw;top:120px;bottom:3vh;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:2vw}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.plate{position:relative;width:min(80%,30vh);aspect-ratio:1;border-radius:50%;background:#88B7D3}
.f{position:absolute;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.cell p{margin:10px 0 0;font-size:20px;text-align:center}
</style></head><body>
<header><h1>Arda</h1><p class="when">Wednesday to Saturday, evenings. Eight courses, £95</p></header>
<div id="sheet"></div>
<script src="kit.js"></script>
<script>
document.querySelector('.when').textContent = 'Wednesday to Saturday, evenings. Eight courses, £95';
var C = ['Oyster, fennel','Beetroot, rye','Mackerel, rhubarb','Leek, hazelnut','Lamb, anchovy','Sheep’s curd, honey','Plum, bay','Chocolate, salt'];
var sheet = document.getElementById('sheet'), all = [];
C.forEach(function(name, k){
  var cell = document.createElement('div'); cell.className = 'cell';
  var plate = document.createElement('div'); plate.className = 'plate'; plate.setAttribute('role', 'img'); plate.setAttribute('aria-label', name);
  var r = rng(k * 977 + 13);
  for (var i = 0; i < 3 + (k % 6); i++){
    var p = document.createElement('div'); p.className = 'f';
    var size = 6 + r() * 26, ang = r() * Math.PI * 2, rad = r() * 30, round = r() < 0.6;
    p.style.width = size + '%'; p.style.height = (round ? size : size * (0.3 + r() * 0.5)) + '%';
    p.style.left = (50 + Math.cos(ang) * rad - size / 2) + '%'; p.style.top = (50 + Math.sin(ang) * rad - size / 2) + '%';
    p.style.borderRadius = round ? '50%' : '2px';
    p.style.background = i % 3 === 0 ? '#1A1614' : (i % 3 === 1 ? '#E47937' : '#3866C1');
    p.dataset.rot = Math.floor(r() * 180);
    p.style.transform = 'rotate(' + p.dataset.rot + 'deg)';
    plate.appendChild(p); all.push({ el:p, plate:plate });
  }
  var t = document.createElement('p'); t.textContent = name;
  cell.appendChild(plate); cell.appendChild(t); sheet.appendChild(cell);
});
addEventListener('pointermove', function(e){
  all.forEach(function(o){
    var r = o.plate.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy) || 1, pull = Math.min(14, 2600 / d);
    o.el.style.transform = 'translate(' + (dx / d * pull) + 'px,' + (dy / d * pull) + 'px) rotate(' + o.el.dataset.rot + 'deg)';
  });
});
</script></body></html>
