<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Objects, Large Rooms</title>
<!-- 15b. A museum exhibition of small objects. Axis: density. This one:
     nearly empty. One object at a time in a very large room. The pointer's
     position across the room is which object is on the plinth. Same
     objects, palette and type as 15a. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#FCF02A;font-family:"Times New Roman",Times,serif;color:#1A1614}
h1{position:fixed;left:24px;top:10px;margin:0;font-weight:normal;font-size:24px}
p.w{position:fixed;left:24px;top:40px;margin:0;font-size:16px}
#o{position:fixed;left:50%;top:46%;width:min(9vw,90px);height:min(9vw,90px);transform:translate(-50%,-50%)}
#plinth{position:fixed;left:50%;top:calc(46% + min(9vw,90px) / 2 + 6px);width:min(14vw,140px);height:30vh;transform:translateX(-50%);background:#0F6E2B}
#n{position:fixed;left:calc(50% + min(14vw,140px) / 2 + 18px);top:calc(46% + min(9vw,90px) / 2 + 12px);margin:0;font-size:16px}
</style></head><body>
<h1>Small Objects, Large Rooms</h1><p class="w">Until 4 May. Gallery 3, free</p>
<div id="o" role="img"></div><div id="plinth" aria-hidden="true"></div><p id="n" aria-live="polite"></p>
<script src="kit.js"></script>
<script>
var KIND = ['button','key','thimble','spoon','coin','die','bead','nail','shell','seed','ring','whistle'];
function obj(k, r){
  var c = ['#1A1614','#F64FB2','#0F6E2B'][Math.floor(r() * 3)], s = '<svg viewBox="-50 -50 100 100" width="100%" height="100%">';
  switch (k % 6){
    case 0: s += '<circle r="38" fill="' + c + '"/><circle r="5" cx="-10" cy="-8" fill="#FCF02A"/><circle r="5" cx="10" cy="8" fill="#FCF02A"/>'; break;
    case 1: s += '<circle cx="-22" r="18" fill="none" stroke="' + c + '" stroke-width="8"/><rect x="-6" y="-5" width="52" height="10" fill="' + c + '"/><rect x="30" y="4" width="8" height="14" fill="' + c + '"/>'; break;
    case 2: s += '<path d="M-26,30 L-20,-24 Q0,-40 20,-24 L26,30 Z" fill="' + c + '"/>'; break;
    case 3: s += '<ellipse cx="-20" rx="20" ry="14" fill="' + c + '"/><rect x="-2" y="-4" width="50" height="8" fill="' + c + '"/>'; break;
    case 4: s += '<circle r="' + (24 + r() * 14) + '" fill="' + c + '"/><circle r="' + (14 + r() * 6) + '" fill="none" stroke="#FCF02A" stroke-width="3"/>'; break;
    default: s += '<rect x="-30" y="-30" width="60" height="60" rx="8" fill="' + c + '"/><circle r="6" fill="#FCF02A"/>';
  }
  return s + '</svg>';
}
var O = [];
for (var i = 0; i < 120; i++){ var r = rng(i * 11 + 1), k = Math.floor(r() * 12); O.push({ svg:obj(k, r), n:KIND[k] + ', ' + (1890 + Math.floor(r() * 120)) + '.' + (1 + Math.floor(r() * 90)) }); }
var o = document.getElementById('o'), n = document.getElementById('n'), cur = -1;
function set(i){ if (i === cur) return; cur = i; o.innerHTML = O[i].svg; o.setAttribute('aria-label', O[i].n); n.textContent = O[i].n; }
addEventListener('pointermove', function(e){ if (sized()) set(Math.min(119, Math.floor(e.clientX / innerWidth * 120))); });
addEventListener('keydown', function(e){ if (e.key === 'ArrowRight') set(Math.min(119, cur + 1)); if (e.key === 'ArrowLeft') set(Math.max(0, cur - 1)); });
set(0);
</script></body></html>
