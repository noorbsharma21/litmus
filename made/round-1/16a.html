<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Rye</title>
<!-- 16a. A bakery. Axis: worlds. This one: one idea. One loaf across the page,
     cut into six. The slice under the pointer comes away from the loaf and
     tells you what it is and what it costs. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#FFFFFF;font-family:"Times New Roman",Times,serif;color:#1A1614}
h1{position:fixed;left:24px;top:14px;margin:0;font-weight:normal;font-size:46px}
p.w{position:fixed;left:24px;top:70px;margin:0;font-size:19px}
#loaf{position:fixed;left:8vw;right:8vw;top:30vh;height:38vh;display:flex;gap:0}
.s{flex:1;position:relative;background:#A40603;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.s:first-child{border-radius:48% 0 0 48% / 60% 0 0 60%}
.s:last-child{border-radius:0 48% 48% 0 / 0 60% 60% 0}
.s::after{content:'';position:absolute;left:10%;right:10%;top:12%;bottom:10%;background:#FFFFFF;border-radius:30%}
.s.on{transform:translateY(-6vh) rotate(-4deg)}
.s:not(:first-child){border-left:5px solid #FFFFFF}
#what{position:fixed;left:8vw;top:74vh;margin:0;font-size:34px}
</style></head><body>
<h1>Daily Rye</h1><p class="w">Tuesday to Sunday from 7, until it runs out</p>
<div id="loaf" role="list"></div>
<p id="what" aria-live="polite"></p>
<script src="kit.js"></script>
<script>
var B = [['Rye',4.5],['Sourdough',5],['Cardamom bun',3.2],['Focaccia',6],['Baguette',3],['Croissant',2.8]];
var loaf = document.getElementById('loaf'), what = document.getElementById('what');
loaf.innerHTML = B.map(function(b, i){ return '<div class="s" role="listitem" tabindex="0" data-i="' + i + '" aria-label="' + b[0] + '"></div>'; }).join('');
function on(i){
  Array.prototype.forEach.call(loaf.children, function(c, k){ c.classList.toggle('on', k === i); });
  what.textContent = B[i][0] + ', £' + B[i][1].toFixed(2);
}
loaf.addEventListener('pointerover', function(e){ var s = e.target.closest('.s'); if (s) on(+s.dataset.i); });
loaf.addEventListener('focusin', function(e){ var s = e.target.closest('.s'); if (s) on(+s.dataset.i); });
</script></body></html>
