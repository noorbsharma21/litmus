<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halde Duo</title>
<!-- 03b. A poster for one night of music. Axis: preweb. This one: print. Two
     inks on yellow stock, the second pass misregistered, a halftone screen
     over half the sheet. The pointer is the registration: move it and the
     second pass slides out of line or back into it. Same facts as 03a. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#FDFF70;font-family:"Times New Roman",Times,serif;color:#1A1614}
.screen{position:fixed;left:0;right:0;bottom:0;height:46%;background-image:radial-gradient(#1A1614 1.6px,transparent 1.9px);background-size:9px 9px;opacity:.9}
.t{position:fixed;left:4vw;top:2vh;margin:0;font-weight:bold;font-size:20vw;line-height:.86;letter-spacing:-.02em}
.t.ghost{color:transparent;-webkit-text-stroke:2px #1A1614;mix-blend-mode:multiply}
.facts{position:fixed;left:4vw;bottom:5vh;margin:0;font-size:30px;line-height:1.25;background:#FDFF70;padding:10px 14px}
</style></head><body>
<h1 class="t" id="t1">HALDE<br>DUO</h1>
<div class="t ghost" id="t2" aria-hidden="true">HALDE<br>DUO</div>
<div class="screen" aria-hidden="true"></div>
<p class="facts">Friday 21 November, The Lantern Room<br>Doors 8pm, music from 9<br>&pound;12 on the door</p>
<script src="kit.js"></script>
<script>
var g = document.getElementById('t2');
addEventListener('pointermove', function(e){
  if (!sized()) return;
  var dx = (e.clientX / innerWidth - 0.5) * 36, dy = (e.clientY / innerHeight - 0.5) * 22;
  g.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
});
g.style.transform = 'translate(9px,6px)';
</script></body></html>
