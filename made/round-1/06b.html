<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Halm, 1979 to 2010</title>
<!-- 06b. A studio archive, 1979 to 2010. Axis: density. This one: nearly
     empty. One year at a time, very large, and only that year's projects
     beneath it. The pointer's position across the screen is the year. Same
     projects, palette and type as 06a. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#3866C1;font-family:"Times New Roman",Times,serif;color:#fff}
h1{position:fixed;left:18px;top:10px;margin:0;font-weight:normal;font-size:24px;color:#88B7D3}
#yr{position:fixed;left:0;right:0;top:22vh;margin:0;text-align:center;font-weight:normal;font-size:min(34vw,44vh);line-height:1;color:#E47937}
#pr{position:fixed;left:0;right:0;top:calc(22vh + min(34vw,44vh) + 12px);margin:0;text-align:center;font-size:22px;line-height:1.6;color:#88B7D3}
</style></head><body>
<h1>Studio Halm, 1979 to 2010</h1>
<p id="yr" aria-live="polite">1979</p><p id="pr"></p>
<script src="kit.js"></script>
<script>
var KIND = ['House','School','Bathhouse','Library','Bridge','Market','Chapel','Housing','Studio','Pavilion','Ferry terminal','Garden'];
var PLACE = ['Porto','Ghent','Bergen','Trieste','Aarhus','Lyon','Cork','Basel','Bilbao','Utrecht','Turku','Ljubljana'];
var r = rng(1979), Y = {};
for (var y = 1979; y <= 2010; y++){
  var n = 2 + Math.floor(r() * 5), list = [];
  for (var i = 0; i < n; i++) list.push(KIND[Math.floor(r() * KIND.length)] + ', ' + PLACE[Math.floor(r() * PLACE.length)]);
  Y[y] = list;
}
var yr = document.getElementById('yr'), pr = document.getElementById('pr'), cur = 0;
function set(y){ if (y === cur) return; cur = y; yr.textContent = y; pr.innerHTML = Y[y].join('<br>'); }
addEventListener('pointermove', function(e){ if (sized()) set(1979 + Math.min(31, Math.floor(e.clientX / innerWidth * 32))); });
addEventListener('keydown', function(e){ if (e.key === 'ArrowRight' && cur < 2010) set(cur + 1); if (e.key === 'ArrowLeft' && cur > 1979) set(cur - 1); });
set(1979);
</script></body></html>
