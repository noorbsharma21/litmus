<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mara Varn, tattoo</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<!-- 18b. A tattoo artist. Axis: route. This one: immersive. The studio after
     hours: the walls are covered in flash and the only light is the work
     lamp, which is the pointer. Where it points, the wall comes up out of
     the dark. Same designs, palette and type as 18a. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#FFFFFF;font-family:"Times New Roman",Times,serif;color:#1A1614}
#wall{position:fixed;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);gap:10px;padding:10px;box-sizing:border-box}
#wall svg{width:100%;height:100%}
#lamp{position:fixed;width:44vmin;height:44vmin;border-radius:50%;box-shadow:0 0 0 300vmax rgba(26,22,20,.95);pointer-events:none;transform:translate(-50%,-50%);left:60%;top:55%;z-index:2}
h1{position:fixed;left:24px;top:6px;margin:0;font-weight:normal;font-size:52px;font-family:"UnifrakturMaguntia",serif;color:#A40603;z-index:3;background:#FFFFFF;padding:0 10px}
p.w{position:fixed;left:24px;top:70px;margin:0;font-size:18px;color:#FFFFFF;z-index:3}
</style></head><body>
<div id="wall" aria-hidden="true"></div>
<div id="lamp" aria-hidden="true"></div>
<h1>Mara Varn</h1><p class="w">Booking Tuesdays. Walk ins from the flash sheet, Saturday afternoons</p>
<script src="kit.js"></script>
<script>
var wall = document.getElementById('wall'), h = '';
for (var n = 0; n < 40; n++){
  var r = rng((n % 12) * 61 + 8), k = 2 + Math.floor(r() * 6), m = 1 + Math.floor(r() * 3), pts = [];
  for (var t = 0; t <= 540; t++){
    var a = t / 540 * Math.PI * 2 * m, rr = 40 * Math.cos(k * a / m) * (0.6 + 0.4 * Math.cos(a * 0.5));
    pts.push([(Math.cos(a) * rr).toFixed(1), (Math.sin(a) * rr).toFixed(1)]);
  }
  h += '<svg viewBox="-50 -50 100 100"><circle r="' + (8 + r() * 10) + '" fill="#A40603"/><path d="M' + pts.map(function(p){ return p.join(','); }).join(' L') +
       '" fill="none" stroke="#1A1614" stroke-width="1.6"/></svg>';
}
wall.innerHTML = h;
var lamp = document.getElementById('lamp'), tx = innerWidth * 0.6, ty = innerHeight * 0.55, x = tx, y = ty;
addEventListener('pointermove', function(e){ tx = e.clientX; ty = e.clientY; });
function frame(){ x += (tx - x) * 0.15; y += (ty - y) * 0.15; lamp.style.left = x + 'px'; lamp.style.top = y + 'px'; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script></body></html>
