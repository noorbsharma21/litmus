<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Hours</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital@0;1&display=swap" rel="stylesheet">
<!-- 20c. A podcast about sleep. Round two. Material: a real photograph of a
     lit window at night, a placeholder. Behaviour: breath. Press and hold and
     you breathe in: the window brightens and a soft sound like distant surf
     rises. Let go and you breathe out and it falls. Left alone, the page
     dims slowly over the minutes you stay on it. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;font-family:"Spectral",Georgia,serif;color:#88B7D3;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
#ph{position:fixed;left:30px;right:30px;top:66px;bottom:100px;background-size:cover;background-position:center;transition:filter .3s}
h1{position:fixed;left:30px;top:26px;margin:0;font-weight:normal;font-style:italic;font-size:20px}
.sub{position:fixed;right:30px;top:30px;margin:0;font-size:14px;opacity:.8}
#ep{position:fixed;left:30px;right:30px;bottom:24px;margin:0;display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;column-gap:24px;font-size:14px;line-height:1.9}
#ep i{color:#E47937;font-style:italic;font-size:13px;margin-left:.3em}
@media (max-width:760px){ #ep{grid-template-columns:repeat(2,auto)} #ph{bottom:150px} }
</style></head><body>
<div id="ph" role="img" aria-label="A lit window at night"></div>
<h1>Slow Hours</h1><p class="sub">a podcast about sleep, Sunday nights</p>
<p id="ep"><span>Tide <i>41 min</i></span><span>Radiator <i>38 min</i></span><span>Night bus <i>44 min</i></span><span>Fog <i>36 min</i></span><span>Sleeper train <i>47 min</i></span><span>Lighthouse <i>40 min</i></span><span>Snow <i>39 min</i></span><span>Ferry <i>43 min</i></span></p>
<script src="images.js"></script>
<script>
var ph = document.getElementById('ph');
ph.style.backgroundImage = 'url(' + U(IMG.night[0], 2000) + ')';
var A = null, noiseGain = null, held = false, breath = 0, start = performance.now();
function sound(){
  if (A) return;
  A = new (window.AudioContext || window.webkitAudioContext)();
  var len = A.sampleRate * 2, buf = A.createBuffer(1, len, A.sampleRate), d = buf.getChannelData(0), last = 0;
  for (var i = 0; i < len; i++){ var w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  var src = A.createBufferSource(); src.buffer = buf; src.loop = true;
  var lp = A.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  noiseGain = A.createGain(); noiseGain.gain.value = 0;
  src.connect(lp); lp.connect(noiseGain); noiseGain.connect(A.destination); src.start();
}
addEventListener('pointerdown', function(){ sound(); A.resume(); held = true; });
addEventListener('pointerup', function(){ held = false; });
addEventListener('keydown', function(e){ if (e.key === ' '){ sound(); A.resume(); held = true; e.preventDefault(); } });
addEventListener('keyup', function(e){ if (e.key === ' ') held = false; });
(function frame(){
  /* a slow inhale while held, a slower exhale after */
  breath += ((held ? 1 : 0) - breath) * (held ? 0.012 : 0.008);
  var mins = (performance.now() - start) / 60000, dim = Math.min(0.55, mins * 0.06);
  ph.style.filter = 'brightness(' + (0.75 - dim + breath * 0.5).toFixed(3) + ') saturate(' + (0.8 + breath * 0.4).toFixed(2) + ')';
  if (noiseGain) noiseGain.gain.value = breath * 0.22;
  requestAnimationFrame(frame);
})();
</script></body></html>
