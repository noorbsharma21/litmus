<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoke and Chain</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
<!-- 19c. A bicycle repair workshop. Round two. Material: real 3D, a wheel in a
     truing stand: rim, hub, thirty-two spokes, tyre. Behaviour: flick it.
     Drag across the wheel and let go and it spins with the speed you gave
     it, then slows on its bearings; the faster you flick, the longer it runs.
     The services hang on the wall behind. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#FCF02A;font-family:"Big Shoulders Display",Impact,sans-serif;color:#1A1614;touch-action:none}
h1{position:fixed;left:28px;top:14px;margin:0;font-weight:800;font-size:72px;line-height:1;z-index:2;pointer-events:none}
p.w{position:fixed;left:30px;top:94px;margin:0;font-family:Georgia,serif;font-size:18px;z-index:2;pointer-events:none}
ul{position:fixed;right:28px;top:22px;margin:0;padding:0;list-style:none;font-size:30px;line-height:1.25;text-align:right;z-index:2;pointer-events:none}
#rpm{position:fixed;left:30px;bottom:5vh;margin:0;font-family:Georgia,serif;font-size:20px;z-index:2}
canvas{cursor:grab}
</style></head><body>
<h1>Spoke and Chain</h1><p class="w">Under the railway arch, Mill Lane. Tuesday to Saturday</p>
<ul><li>Puncture &pound;8</li><li>Brake bleed &pound;25</li><li>Wheel true &pound;15</li><li>Full service &pound;60</li><li>New chain &pound;20</li><li>Bearings &pound;30</li></ul>
<p id="rpm" aria-live="off"></p>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import { stage } from './three-kit.js';
const S = stage({ bg:'#FCF02A', key:2.4, fill:0.6, exposure:1.0, fov:30 });
const { THREE, scene, camera } = S;
camera.position.set(-2.2, 1.2, 12.5); camera.lookAt(0, 0.2, 0);
S.catcher(-3.9, 40, 0.25);
const steel = new THREE.MeshStandardMaterial({ color:'#cfd2d4', metalness:1, roughness:0.22 });
const black = new THREE.MeshStandardMaterial({ color:'#161616', roughness:0.85 });
const pink = new THREE.MeshStandardMaterial({ color:'#F64FB2', roughness:0.4, metalness:0.2 });
const wheel = new THREE.Group(); scene.add(wheel);
const tyre = new THREE.Mesh(new THREE.TorusGeometry(3.3, 0.22, 24, 120), black); tyre.castShadow = true; wheel.add(tyre);
const rim = new THREE.Mesh(new THREE.TorusGeometry(3.05, 0.09, 12, 120), steel); wheel.add(rim);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.9, 32), steel); hub.rotation.x = Math.PI / 2; wheel.add(hub);
for (let i = 0; i < 32; i++){
  const side = i % 2 ? 0.32 : -0.32, a = i / 32 * Math.PI * 2 + (i % 2 ? 0.2 : -0.2);
  const from = new THREE.Vector3(Math.cos(i / 32 * Math.PI * 2) * 0.2, Math.sin(i / 32 * Math.PI * 2) * 0.2, side);
  const to = new THREE.Vector3(Math.cos(a) * 3.0, Math.sin(a) * 3.0, 0);
  const len = from.distanceTo(to), sp = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, len, 6), steel);
  sp.position.copy(from).add(to).multiplyScalar(0.5); sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), to.clone().sub(from).normalize());
  wheel.add(sp);
}
const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 12), pink); valve.position.set(0, 2.9, 0); wheel.add(valve);
/* the stand */
[[-1, 1], [1, 1]].forEach(([s]) => { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 4.2, 0.18), pink); leg.position.set(0, -1.8, s * 0.7); leg.castShadow = true; scene.add(leg); });
const foot = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 2), pink); foot.position.set(0, -3.8, 0); foot.castShadow = foot.receiveShadow = true; scene.add(foot);
let w = 0, drag = false, la = 0, lt = 0, flick = 0;
function ang(e){ return Math.atan2(e.clientY - innerHeight / 2, e.clientX - innerWidth / 2); }
addEventListener('pointerdown', (e) => { drag = true; la = ang(e); lt = performance.now(); flick = 0; });
addEventListener('pointermove', (e) => { if (!drag) return; const a = ang(e), t = performance.now(); let d = a - la; if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2;
  flick = -d / Math.max(8, t - lt) * 16; wheel.rotation.z -= d; la = a; lt = t; });
addEventListener('pointerup', () => { if (drag) w = flick; drag = false; });
const rpm = document.getElementById('rpm');
S.loop(() => { if (!drag){ wheel.rotation.z += w; w *= 0.992; } rpm.textContent = Math.abs(w) > 0.003 ? Math.round(Math.abs(w) * 60 * 60 / (Math.PI * 2)) + ' rpm' : ''; });
</script></body></html>
