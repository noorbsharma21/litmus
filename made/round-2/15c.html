<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Objects, Large Rooms</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital@0;1&display=swap" rel="stylesheet">
<!-- 15c. A museum exhibition of small objects. Round two. Material: real 3D, a
     cabinet drawer and the objects in it, brass, glass, ceramic and bone, each
     its own material. Behaviour: pull the drawer. Drag the drawer front toward
     you and it slides out on its runners, and the objects lying in it come
     into the light. Let go and it stays where you left it. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0F6E2B;font-family:"Libre Caslon Text",Georgia,serif;color:#FCF02A;touch-action:none}
h1{position:fixed;left:30px;top:26px;margin:0;font-weight:normal;font-size:20px;z-index:2;pointer-events:none}
p.w{position:fixed;left:30px;top:56px;margin:0;font-size:15px;z-index:2;pointer-events:none;font-style:italic}
canvas{cursor:grab}
</style></head><body>
<h1>Small Objects, Large Rooms</h1><p class="w">Until 4 May. Gallery 3, free</p>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import { stage } from './three-kit.js';
const S = stage({ bg:'#0F6E2B', key:2.8, fill:0.45, exposure:1.05, fov:32 });
const { THREE, scene, camera } = S;
camera.position.set(0, 10.5, 6.2); camera.lookAt(0, 0.2, 1.6);
S.key.position.set(2, 10, 6);
const wood = new THREE.MeshStandardMaterial({ color:'#6b4a2e', roughness:0.6 });
const felt = new THREE.MeshStandardMaterial({ color:'#1d2a4a', roughness:1 });
const cab = new THREE.Mesh(new THREE.BoxGeometry(8.4, 3.2, 6), wood); cab.position.set(0, -0.2, -3.4); cab.castShadow = cab.receiveShadow = true; scene.add(cab);
const drawer = new THREE.Group(); scene.add(drawer);
const base = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.15, 5.4), felt); base.position.y = 0.6; base.receiveShadow = true; drawer.add(base);
[[0, 1.0, 2.7, 7.6, 0.8, 0.18],[0, 1.0, -2.7, 7.6, 0.8, 0.18],[-3.8, 1.0, 0, 0.18, 0.8, 5.4],[3.8, 1.0, 0, 0.18, 0.8, 5.4]].forEach((b) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(b[3], b[4], b[5]), wood); m.position.set(b[0], b[1], b[2]); m.castShadow = m.receiveShadow = true; drawer.add(m); });
const front = new THREE.Mesh(new THREE.BoxGeometry(8.2, 1.4, 0.25), wood); front.position.set(0, 1.0, 2.9); front.castShadow = true; drawer.add(front);
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.18, 24, 16), new THREE.MeshStandardMaterial({ color:'#c9a24a', metalness:1, roughness:0.25 })); knob.position.set(0, 1.0, 3.1); drawer.add(knob);
/* the objects, each in its own material */
const brass = new THREE.MeshStandardMaterial({ color:'#c9a24a', metalness:1, roughness:0.3 });
const glass = new THREE.MeshPhysicalMaterial({ color:'#9fd0c8', transmission:0.85, thickness:0.6, roughness:0.05 });
const ceramic = new THREE.MeshPhysicalMaterial({ color:'#F2EEE9', roughness:0.25, clearcoat:0.7 });
const bone = new THREE.MeshStandardMaterial({ color:'#e8dcc4', roughness:0.7 });
const red = new THREE.MeshStandardMaterial({ color:'#A40603', roughness:0.4 });
const objs = [];
function put(mesh, x, z, ry){ mesh.position.set(x, 0.72 + (mesh.userData.lift || 0), z); mesh.rotation.y = ry || 0; mesh.castShadow = true; drawer.add(mesh); objs.push(mesh); }
const key = new THREE.Group(); const ring = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.08, 16, 32), brass); ring.rotation.x = Math.PI / 2; key.add(ring);
const shaft = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.12), brass); shaft.position.x = 0.9; key.add(shaft);
const bit = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.08, 0.32), brass); bit.position.set(1.4, 0, 0.14); key.add(bit); key.userData.lift = 0.04; put(key, -2.4, -1.4, 0.4);
const cup = new THREE.Mesh(new THREE.LatheGeometry([0,1,2,3,4,5,6].map((i) => new THREE.Vector2(i === 0 ? 0 : 0.28 + i * 0.05, i * 0.12)).concat([new THREE.Vector2(0.55, 0.72)]), 48), ceramic); put(cup, 0.2, -1.2);
const bead = new THREE.Mesh(new THREE.SphereGeometry(0.34, 48, 32), glass); bead.userData.lift = 0.34; put(bead, 2.2, -1.5);
for (let i = 0; i < 5; i++){ const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.05, 48), brass); coin.userData.lift = 0.03 + i * 0.055; put(coin, -2.2 + (i % 2) * 0.05, 1.0, i * 0.3); }
const thimble = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.26, 0.5, 32, 1, false), red); thimble.userData.lift = 0.25; put(thimble, -0.2, 1.1);
const spoon = new THREE.Group(); const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), bone); bowl.scale.set(1, 0.4, 0.7); bowl.rotation.x = Math.PI; spoon.add(bowl);
const handle = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.05, 0.1), bone); handle.position.x = 0.85; spoon.add(handle); spoon.userData.lift = 0.08; put(spoon, 1.6, 1.0, -0.3);
let open = 0, target = 0, drag = false, ly = 0;
addEventListener('pointerdown', (e) => { drag = true; ly = e.clientY; });
addEventListener('pointermove', (e) => { if (!drag) return; target = Math.max(0, Math.min(5.2, target + (e.clientY - ly) * 0.018)); ly = e.clientY; });
addEventListener('pointerup', () => { drag = false; });
addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') target = Math.min(5.2, target + 0.6); if (e.key === 'ArrowUp') target = Math.max(0, target - 0.6); });
target = 5.0;
S.loop(() => { open += (target - open) * 0.12; drawer.position.z = -3.4 + 0.6 + open; });
</script></body></html>
