<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Nuit</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
<!-- 14c. A dance company's season. Round two. Material: a real photograph of
     a dancer, a placeholder, on black. Behaviour: speed. Hold still and the
     picture is still. Move, and the dancer smears in the direction you are
     moving, the faster the further, the way a long exposure records a body.
     Stop and she settles back into one. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0B0A09;font-family:"Italiana",Georgia,serif;color:#fff}
.l{position:fixed;inset:-4vh -4vw;background-size:contain;background-repeat:no-repeat;background-position:62% center;will-change:transform,opacity;mix-blend-mode:screen}
h1{position:fixed;left:28px;top:20px;margin:0;font-weight:normal;font-size:64px;z-index:3}
#season{position:fixed;left:30px;bottom:5vh;margin:0;font-size:26px;line-height:1.5;z-index:3;background:#0B0A09;padding:8px 12px}
</style></head><body>
<div id="stack" role="img" aria-label="A dancer in a long exposure"></div>
<h1>Company Nuit</h1>
<p id="season">Stillwater, 3 to 8 February<br>Four Walls, 14 to 19 April<br>Late Hours, 9 to 14 June</p>
<script src="images.js"></script>
<script>
var stack = document.getElementById('stack'), L = [], N = 6, url = 'url(' + U(IMG.dance[0], 1600) + ')';
for (var i = 0; i < N; i++){ var d = document.createElement('div'); d.className = 'l'; d.style.backgroundImage = url; stack.appendChild(d); L.push(d); }
var vx = 0, vy = 0, sx = 0, sy = 0, lx = null, ly = null, lt = 0;
addEventListener('pointermove', function(e){
  var t = performance.now();
  if (lx !== null){ var dt = Math.max(8, t - lt); vx = (e.clientX - lx) / dt * 16; vy = (e.clientY - ly) / dt * 16; }
  lx = e.clientX; ly = e.clientY; lt = t;
});
(function frame(){
  sx += (vx - sx) * 0.12; sy += (vy - sy) * 0.12; vx *= 0.9; vy *= 0.9;
  var sp = Math.min(60, Math.hypot(sx, sy));
  L.forEach(function(d, i){
    var k = i / (N - 1);
    d.style.transform = 'translate(' + (-sx * k * 3).toFixed(1) + 'px,' + (-sy * k * 3).toFixed(1) + 'px)';
    d.style.opacity = i === 0 ? 1 : (sp / 60 * (1 - k * 0.7)).toFixed(3);
    d.style.filter = i === 0 ? 'none' : 'blur(' + (k * sp / 12).toFixed(1) + 'px)';
  });
  requestAnimationFrame(frame);
})();
</script></body></html>
