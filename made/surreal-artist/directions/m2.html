<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odile Varga</title>
<!--
  Offspring m2 of the four-up he liked (directions/index.html, cr3).
  One mutation: the territories answer each other. Point at a world and
  it takes ground from the other three, which give way. Tap its letter
  and it takes the whole sheet; tap again and the borders come back.
  This is direction C's behaviour applied to the sheet itself.
  Everything else is the parent, unchanged.
-->
<style>
html,body{margin:0;height:100%;background:#FFFFFF}
.sheet{display:flex;flex-direction:column;height:100vh;gap:6px}
.row{display:flex;gap:6px;flex:1 1 0;min-height:0;transition:flex-grow .7s cubic-bezier(.2,.7,.1,1)}
.cell{position:relative;overflow:hidden;flex:1 1 0;min-width:0;transition:flex-grow .7s cubic-bezier(.2,.7,.1,1)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.k{position:absolute;right:0;top:0;z-index:2;background:#1A1614;color:#FFFFFF;border:0;cursor:pointer;
  font:20px "Times New Roman", Times, serif;padding:4px 12px 6px;min-width:44px;min-height:44px}
.k:focus-visible{outline:3px solid #F4432D;outline-offset:-3px}
@media (prefers-reduced-motion: reduce){ .row, .cell{transition:none} }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="row">
    <div class="cell"><iframe src="a.html" title="A"></iframe><button class="k" type="button">A</button></div>
    <div class="cell"><iframe src="b.html" title="B"></iframe><button class="k" type="button">B</button></div>
  </div>
  <div class="row">
    <div class="cell"><iframe src="c.html" title="C"></iframe><button class="k" type="button">C</button></div>
    <div class="cell"><iframe src="d.html" title="D"></iframe><button class="k" type="button">D</button></div>
  </div>
</div>
<script>
var rows = Array.prototype.slice.call(document.querySelectorAll('.row'));
var cells = Array.prototype.slice.call(document.querySelectorAll('.cell'));
var open = null;
function settle(hot){
  rows.forEach(function(r){
    var has = hot && r.contains(hot), hasOpen = open && r.contains(open);
    r.style.flexGrow = open ? (hasOpen ? 60 : 0.0001) : (has ? 2.1 : 1);
  });
  cells.forEach(function(c){
    c.style.flexGrow = open ? (c === open ? 60 : 0.0001) : (c === hot ? 2.6 : 1);
  });
}
/* entering an iframe still fires pointerenter on the element that holds
   it, so the sheet can tell which world the pointer is in */
cells.forEach(function(c){
  c.addEventListener('pointerenter', function(){ if (!open) settle(c); });
  c.querySelector('.k').addEventListener('click', function(){ open = open === c ? null : c; settle(c); });
  c.querySelector('.k').addEventListener('focus', function(){ if (!open) settle(c); });
});
document.getElementById('sheet').addEventListener('pointerleave', function(){ if (!open) settle(null); });
settle(null);
</script>
</body>
</html>
