<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odile Varga</title>
<!--
  Offspring m3 of the four-up he liked (directions/index.html, cr3).
  One mutation: uneven territories. The parent is a regular two by two
  grid, and STANDING refuses simple conventional organised blocks. This
  tests whether the grid was fine because every cell is a different
  living world, or whether it was the block and he liked the page in
  spite of it. Same four worlds, divided like land rather than a table.
  Which world takes the most ground is arbitrary here.
  Everything else is the parent, unchanged.
-->
<style>
html,body{margin:0;height:100%;background:#FFFFFF}
body{display:grid;height:100vh;gap:6px;
  grid-template-columns:1.55fr .55fr 1fr;
  grid-template-rows:1fr .85fr .7fr;
  grid-template-areas:"a a b" "a a b" "c d d"}
.cell{position:relative;overflow:hidden;min-width:0;min-height:0}
.a{grid-area:a} .b{grid-area:b} .c{grid-area:c} .d{grid-area:d}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.k{position:absolute;right:0;top:0;z-index:2;background:#1A1614;color:#FFFFFF;
  font:20px "Times New Roman", Times, serif;padding:4px 12px 6px;text-decoration:none}
@media (max-width:760px){
  body{grid-template-columns:1fr .7fr;grid-template-rows:1.3fr .8fr 1fr;
       grid-template-areas:"a a" "b c" "d d"}
}
</style>
</head>
<body>
<div class="cell a"><iframe src="a.html" title="A"></iframe><a class="k" href="a.html" target="_blank">A</a></div>
<div class="cell b"><iframe src="b.html" title="B"></iframe><a class="k" href="b.html" target="_blank">B</a></div>
<div class="cell c"><iframe src="c.html" title="C"></iframe><a class="k" href="c.html" target="_blank">C</a></div>
<div class="cell d"><iframe src="d.html" title="D"></iframe><a class="k" href="d.html" target="_blank">D</a></div>
</body>
</html>
