<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four directions</title>
<!-- A viewing frame for comparing four directions at once. Not a design. -->
<style>
html,body{margin:0;height:100%;background:#FFFFFF}
body{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:100vh;gap:6px}
.cell{position:relative;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.k{position:absolute;right:0;top:0;z-index:2;background:#1A1614;color:#FFFFFF;
  font:20px "Times New Roman", Times, serif;padding:4px 12px 6px;text-decoration:none}
@media (max-width:760px){ body{grid-template-columns:1fr;grid-template-rows:repeat(4, 80vh);height:auto} }
</style>
</head>
<body>
<div class="cell"><iframe src="a.html" title="Direction A"></iframe><a class="k" href="a.html" target="_blank">A</a></div>
<div class="cell"><iframe src="b.html" title="Direction B"></iframe><a class="k" href="b.html" target="_blank">B</a></div>
<div class="cell"><iframe src="c.html" title="Direction C"></iframe><a class="k" href="c.html" target="_blank">C</a></div>
<div class="cell"><iframe src="d.html" title="Direction D"></iframe><a class="k" href="d.html" target="_blank">D</a></div>
</body>
</html>
