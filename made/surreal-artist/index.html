<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odile Varga</title>
<!--
  Made from taste.md, second version, 6 November 2026, after critique cr1.
  The first version is in git at 2cd0ba0.

  ROUTE      Made for it. A flat field of colour with holes torn in it, and
             a painting through every hole. The holes are cut for this
             visit, in the order the visitor makes them, so the collage on
             screen exists only here.
  BEHAVIOUR  Responsive, felt at once. A hole follows the pointer from the
             first movement and shows what is behind it. Clicking leaves
             the hole torn open and the next one shows another painting.
             Nothing on the page explains this, because cr1 had working
             interactions and a paragraph explaining them, and read as
             having none.
  MARKERS    Every hole has a leader line to its title. The one part of
             the first version he kept.
  TYPE       The browser's default serif, set raw. Not the grotesque with
             monospace labels he called AI-native. Default type is what
             Olia Lialina and JODI use, and he said both of those were
             cool. A choice, open to veto.
  COLOUR     The ground is one flat measured accent at full strength. Rims,
             lines and labels each take a different one. No beige, no
             paper, no two colour scheme.
  REFUSED    Middle dot separators, counters, explanatory copy, clinical
             notes, a header and footer, sections.
-->
<style>
:root{ --ink:#1A1614; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Times New Roman", Times, serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none}
#field{position:fixed;inset:0}
#field.ready{transition:background-color .6s}
.hole{position:fixed;overflow:hidden;pointer-events:none}
.hole img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
/* each rim is stacked with its own hole, so a newer tear covers the
   older edges the way paper would, instead of every rim being drawn
   over every painting */
.rim{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;overflow:visible}
#over{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;overflow:visible}
.chip{position:fixed;font-size:19px;line-height:1.25;padding:5px 10px 6px;
  pointer-events:none;max-width:min(320px, 70vw)}
.name{position:fixed;left:24px;top:18px;font-size:34px;margin:0;font-weight:normal;
  letter-spacing:-.01em;pointer-events:none}
.ctl{position:fixed;bottom:18px;font:inherit;font-size:19px;padding:6px 12px 7px;border:0;cursor:pointer;
  min-height:44px;display:inline-flex;align-items:center}
.ctl.write{left:24px;text-decoration:none}
.ctl.close{right:24px}
.ctl[hidden]{display:none}
.ctl:focus-visible, #stage:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#stage{position:fixed;inset:0;cursor:crosshair}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:640px){
  .name{font-size:26px;left:16px;top:12px}
  .chip{font-size:17px}
  .ctl{font-size:17px;bottom:12px}
  .ctl.write{left:16px} .ctl.close{right:16px}
}
</style>
</head>
<body>
<div id="field"></div>
<div id="holes"></div>
<svg id="over" aria-hidden="true"></svg>
<div id="chips" aria-hidden="true"></div>
<div id="stage" tabindex="0" role="application"
     aria-label="Paintings by Odile Varga, seen through holes torn in a wall of colour. Arrow keys move the hole, Enter tears it open, Escape closes them all."></div>
<h1 class="name" id="name">Odile Varga</h1>
<a class="ctl write" id="write" href="mailto:studio@example.com">write to her</a>
<button class="ctl close" id="close" type="button" hidden>close them</button>
<p class="sr" id="live" aria-live="polite"></p>
<ul class="sr" id="all"></ul>

<script>
var W = [
  ['art-01','Four of the same woman'], ['art-02','A totem for the garden’s spine'],
  ['art-03','Three people sharing one pair of arms'], ['art-04','Portrait in weather'],
  ['art-05','A face that could not decide'], ['art-06','One drawing, four climates'],
  ['art-07','The name leaves by the left edge'], ['art-08','The hat went on ahead'],
  ['art-09','Kept fresh'], ['art-10','Painting with an eye in hand'],
  ['art-11','Lost property, sorted by colour'], ['art-12','Two fish agreeing'],
  ['art-13','Weather report, four regions'], ['art-14','The queue for the other eye'],
  ['art-15','Red room, both sides'], ['art-16','Orange, with the hair scrubbed in'],
  ['art-17','Green, the same girl a year later'], ['art-18','With the recipe attached'],
  ['art-19','Handmaiden, watching from the arm'], ['art-20','Two people balanced on a horizon'],
  ['art-21','A sentence too long for the wall'], ['art-22','Lincoln, no colour allowed'],
  ['art-23','Half a face, kept by bees'], ['art-24','The desk it was made on']
];
/* One palette per wall, not a colour per element. The first draw of this
   page cycled every rim, label and button through a different accent and
   he called it not cohesive (cr2). Each palette below is three colours
   that appear together in one of his references, so the combination was
   chosen by somebody, not assembled here.
     P17  Super Riso 2: magenta sitting straight on acid yellow, bottle green type
     P08  nine posters: pink, ultramarine, bright red
     S03  yellow field with the figures knocked out, near-black
     P11  BLUE in sync: cobalt, orange, pale blue
     P07  cattle in flat oxide red, white, near-black                  */
var WALLS = [
  { from:'P17', ground:'#FCF02A', rim:'#F64FB2', label:'#0F6E2B' },
  { from:'P08', ground:'#EE5884', rim:'#072493', label:'#F4432D' },
  { from:'S03', ground:'#FDFF70', rim:'#1A1614', label:'#1A1614' },
  { from:'P11', ground:'#3866C1', rim:'#E47937', label:'#88B7D3' },
  { from:'P07', ground:'#A40603', rim:'#FFFFFF', label:'#1A1614' }
];
var wall;
var IMG = '../../images/';
var MAXH = 14;

var field = document.getElementById('field'), holesEl = document.getElementById('holes'),
    over = document.getElementById('over'), chipsEl = document.getElementById('chips'),
    stage = document.getElementById('stage'), live = document.getElementById('live'),
    closeBtn = document.getElementById('close');

document.getElementById('all').innerHTML = W.map(function(w){ return '<li>' + w[1] + '</li>'; }).join('');

function lum(h){ var c = h.replace('#',''); return [0,2,4].map(function(i){ var x = parseInt(c.substr(i,2),16)/255;
  return x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4); })
  .reduce(function(a, v, i){ return a + v * [0.2126,0.7152,0.0722][i]; }, 0); }
function contrast(a, b){ var x = lum(a), y = lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
function textOn(bg){ return contrast(bg,'#1A1614') >= contrast(bg,'#FFFFFF') ? '#1A1614' : '#FFFFFF'; }
function rng(seed){ var x = seed || 1; return function(){ x = (x * 1664525 + 1013904223) % 4294967296; return x / 4294967296; }; }
function pick(n, not){ var k, tries = 0; do { k = Math.floor(Math.random() * n); tries++; }
  while (not && not.indexOf(k) > -1 && tries < 200); return k; }

/* a torn edge, not a circle: jittered radius around the rim, seeded so a
   hole keeps its own shape for as long as it stays open */
function tornShape(R, seed){
  var r = rng(seed), n = 34, pts = [], base = 0.86 + r() * 0.1, f = 2 + Math.floor(r() * 3), ph = r() * 6;
  for (var i = 0; i < n; i++){
    var a = (i / n) * Math.PI * 2;
    var k = base + (r() - 0.5) * 0.22 + Math.sin(a * f + ph) * 0.06;
    pts.push([Math.cos(a) * R * k, Math.sin(a) * R * k]);
  }
  return pts;
}

var R, IMGS;
function sizes(){
  var m = Math.min(innerWidth, innerHeight);
  R = Math.max(96, Math.min(190, m * 0.24));
  IMGS = Math.max(R * 2.6, 520);
}
sizes();

var groundCol, holes = [], lens = null, used = [];
var tx = innerWidth * 0.56, ty = innerHeight * 0.48, lx = tx, ly = ty;
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;


function setGround(){
  var prev = wall;
  do { wall = WALLS[Math.floor(Math.random() * WALLS.length)]; } while (prev && wall === prev && WALLS.length > 1);
  groundCol = wall.ground;
  field.style.backgroundColor = groundCol;
  document.getElementById('name').style.color = textOn(groundCol);
}

function makeHole(k, seed){
  var el = document.createElement('div');
  el.className = 'hole';
  var img = document.createElement('img');
  img.alt = ''; img.src = IMG + W[k][0] + '.jpg';
  img.style.width = img.style.height = IMGS + 'px';
  el.appendChild(img);
  holesEl.appendChild(el);
  var rimSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  rimSvg.setAttribute('class', 'rim');
  rimSvg.setAttribute('aria-hidden', 'true');
  holesEl.appendChild(rimSvg);
  var rim = wall.rim;
  var chipBg = wall.label;
  var chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = W[k][1];
  chip.style.background = chipBg;
  chip.style.color = textOn(chipBg);
  chipsEl.appendChild(chip);
  return { k:k, el:el, img:img, chip:chip, rim:rim, rimSvg:rimSvg, shape:tornShape(R, seed), x:0, y:0, seed:seed };
}

function placeHole(h, x, y){
  h.x = x; h.y = y;
  var S = R * 2.4;
  h.el.style.left = (x - S/2) + 'px'; h.el.style.top = (y - S/2) + 'px';
  h.el.style.width = h.el.style.height = S + 'px';
  h.el.style.clipPath = 'polygon(' + h.shape.map(function(p){
    return (p[0] + S/2).toFixed(1) + 'px ' + (p[1] + S/2).toFixed(1) + 'px'; }).join(',') + ')';

  /* the label goes away from the middle of the screen, so it lands where
     there is room, and the leader line runs from the torn edge to it */
  var cx = innerWidth / 2, cy = innerHeight / 2;
  var pref = Math.atan2(y - cy, x - cx);
  if (Math.hypot(x - cx, y - cy) < 40) pref = -0.55;
  var cw = h.chip.offsetWidth || 220, ch = h.chip.offsetHeight || 34;
  var d = R * 1.08 + 64;
  /* Try the preferred side, then the opposite side, then straight above
     and below. Clamping a wide label against the screen edge used to push
     it back over its own hole, and the leader line shrank to a stub. */
  var tries = [pref, pref + Math.PI];
  for (var a = 1; a < 12; a++) tries.push(pref + a * Math.PI / 6);
  var hx0 = x - R, hx1 = x + R, hy0 = y - R, hy1 = y + R;
  /* Labels also keep off every other label. Text over text breaks the
     legibility rule, and on a busy wall the first version stacked three
     titles on top of each other in the middle. */
  var others = holes.concat(lens ? [lens] : []).filter(function(o){ return o !== h && o.rect; });
  function clash(l, t){
    var pad = 8, n = 0;
    if (l < hx1 && l + cw > hx0 && t < hy1 && t + ch > hy0) n += 2;
    others.forEach(function(o){
      var r = o.rect;
      if (l < r.l + r.w + pad && l + cw + pad > r.l && t < r.t + r.h + pad && t + ch + pad > r.t) n += 1;
    });
    return n;
  }
  var left, top, ang, best = null;
  for (var t = 0; t < tries.length; t++){
    var a2 = tries[t];
    var px = x + Math.cos(a2) * d, py = y + Math.sin(a2) * d;
    var l = Math.abs(Math.cos(a2)) < 0.3 ? px - cw / 2 : (Math.cos(a2) >= 0 ? px : px - cw);
    var tp = py - ch / 2;
    l = Math.max(12, Math.min(innerWidth - cw - 12, l));
    tp = Math.max(64, Math.min(innerHeight - ch - 72, tp));
    var c = clash(l, tp);
    if (!best || c < best.c){ best = { c:c, l:l, t:tp, a:a2 }; }
    if (c === 0) break;
  }
  left = best.l; top = best.t; ang = best.a;
  h.rect = { l:left, t:top, w:cw, h:ch };
  h.chip.style.left = left + 'px'; h.chip.style.top = top + 'px';
  /* the line ends on the nearest edge of the label */
  h.ax = Math.max(left, Math.min(left + cw, x));
  h.ay = Math.max(top, Math.min(top + ch, y));
  if (h.ax > left && h.ax < left + cw && h.ay > top && h.ay < top + ch) h.ay = top;
  h.ex = x + Math.cos(ang) * R * 0.9; h.ey = y + Math.sin(ang) * R * 0.9;
}

function drawOver(){
  var out = '';
  holes.concat(lens ? [lens] : []).forEach(function(h){
    var pts = h.shape.map(function(p){ return (p[0] + h.x).toFixed(1) + ',' + (p[1] + h.y).toFixed(1); }).join(' ');
    h.rimSvg.innerHTML = '<polygon points="' + pts + '" fill="none" stroke="' + h.rim + '" stroke-width="4" stroke-linejoin="round"/>';
    out += '<line x1="' + h.ex.toFixed(1) + '" y1="' + h.ey.toFixed(1) + '" x2="' + h.ax.toFixed(1) + '" y2="' + h.ay.toFixed(1) +
           '" stroke="' + h.rim + '" stroke-width="2"/>';
    out += '<circle cx="' + h.ex.toFixed(1) + '" cy="' + h.ey.toFixed(1) + '" r="4" fill="' + h.rim + '"/>';
  });
  over.innerHTML = out;
}

function newLens(){
  var k = pick(W.length, used);
  lens = makeHole(k, Math.floor(Math.random() * 1e6));
  placeHole(lens, lx, ly);
}

function tear(){
  holes.push(lens);
  used.push(lens.k);
  live.textContent = 'Torn open onto ' + W[lens.k][1] + '.';
  if (holes.length > MAXH){
    var old = holes.shift();
    old.el.remove(); old.rimSvg.remove(); old.chip.remove();
    used.splice(used.indexOf(old.k), 1);
  }
  if (used.length >= W.length) used = holes.map(function(h){ return h.k; });
  closeBtn.hidden = false;
  newLens();
  drawOver();
}

function closeAll(){
  holes.forEach(function(h){ h.el.remove(); h.rimSvg.remove(); h.chip.remove(); });
  holes = []; used = [];
  if (lens){ lens.el.remove(); lens.rimSvg.remove(); lens.chip.remove(); }
  closeBtn.hidden = true;
  setGround(); styleControls();
  newLens(); drawOver();
  live.textContent = 'Closed. A new wall.';
}

function styleControls(){
  var w = document.getElementById('write');
  [w, closeBtn].forEach(function(b){ b.style.background = wall.label; b.style.color = textOn(wall.label); });
}

/* the hole eases toward the pointer so it feels moved rather than
   teleported; with reduced motion it simply jumps */
function tick(){
  var e = reduce ? 1 : 0.22;
  lx += (tx - lx) * e; ly += (ty - ly) * e;
  if (lens) placeHole(lens, lx, ly);
  drawOver();
  requestAnimationFrame(tick);
}

stage.addEventListener('pointermove', function(e){ tx = e.clientX; ty = e.clientY; });
stage.addEventListener('pointerdown', function(e){
  tx = lx = e.clientX; ty = ly = e.clientY;
  if (lens) placeHole(lens, lx, ly);
  tear();
});
stage.addEventListener('keydown', function(e){
  var s = 36;
  if (e.key === 'ArrowLeft'){ tx -= s; e.preventDefault(); }
  else if (e.key === 'ArrowRight'){ tx += s; e.preventDefault(); }
  else if (e.key === 'ArrowUp'){ ty -= s; e.preventDefault(); }
  else if (e.key === 'ArrowDown'){ ty += s; e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' '){ tear(); e.preventDefault(); }
  else if (e.key === 'Escape'){ closeAll(); e.preventDefault(); }
  tx = Math.max(0, Math.min(innerWidth, tx)); ty = Math.max(0, Math.min(innerHeight, ty));
});
closeBtn.addEventListener('click', closeAll);
addEventListener('resize', function(){
  sizes();
  holes.concat(lens ? [lens] : []).forEach(function(h){
    h.shape = tornShape(R, h.seed);
    h.img.style.width = h.img.style.height = IMGS + 'px';
    placeHole(h, h.x, h.y);
  });
});

setGround(); styleControls(); newLens(); drawOver(); requestAnimationFrame(tick);
/* the wall is its colour from the first frame; only later changes fade */
requestAnimationFrame(function(){ requestAnimationFrame(function(){ field.classList.add('ready'); }); });
</script>
</body>
</html>
