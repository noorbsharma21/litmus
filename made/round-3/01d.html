<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottle Hours</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital@0;1&family=Reenie+Beanie&display=swap" rel="stylesheet">
<!-- 01d. A natural wine shop. Round three, from 01c. Revised after cr7: no
     automatic italics, the notes can no longer run into each other, and every
     bottle wears its own printed label (woodcut, riso, cyanotype, halftone,
     photocopy, a stamped pattern, a drawn one) the way natural wine labels
     are made, not a text label. Earlier: cr6: keep the bottles,
     lose the fake wooden shelf, and mix the polish with a hand: each bottle
     has a note scratched on the ground in front of it. The render goes
     through film grain so the glass stops reading as half real. Was: 01c. Round two. Material: real 3D, glass you can see
     through, lit low like a cellar. Behaviour: pick up and turn. Press on a
     bottle and it comes off the shelf toward you; drag to turn it in your hand
     and read the label; let go and it goes back. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#12100E;font-family:"Libre Caslon Text",Georgia,serif;color:#F2EEE9}
h1{position:fixed;left:32px;top:30px;margin:0;font-weight:normal;font-size:13px;letter-spacing:.24em;text-transform:uppercase;z-index:2;pointer-events:none}
p.w{position:fixed;left:32px;bottom:30px;margin:0;font-size:14px;opacity:.7;z-index:2;pointer-events:none}
/* the scratched notes: a hand face roughened by the pencil filter */
.n{position:fixed;left:0;top:0;margin:0;font-family:"Reenie Beanie",cursive;font-size:24px;line-height:.95;color:#CFC8BC;white-space:normal;text-align:center;pointer-events:none;z-index:2;filter:url(#pencil);transition:opacity .3s;transform-origin:50% 0}
#held{position:fixed;right:32px;top:28px;margin:0;font-size:15px;z-index:2;pointer-events:none;text-align:right}
</style></head><body>
<h1>Bottle Hours</h1><p class="w">12 Ardley Street, Thursday to Sunday</p>
<p id="held" aria-live="polite"></p>
<script src="print.js"></script>
<script>pencilFilter();</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import { stage } from '../round-2/three-kit.js';
const S = stage({ bg:'#12100E', key:3.2, fill:0.12, exposure:1.05, fov:30, analog:{ mode:'grain', grain:0.11, vignette:0.45 } });
const { THREE, scene, camera } = S;
camera.position.set(0, 2.1, 9.5); camera.lookAt(0, 1.4, 0);
S.key.position.set(-4, 7, 5);
S.catcher(0, 30, 0.45);

/* the labels: each bottle printed differently, the picture and the process
   chosen for the wine, the name set into the print in roman */
const UN = (id, w) => 'https://images.unsplash.com/' + id + '?auto=format&fit=crop&w=' + w + '&q=80';
const LABELS = [
  { kind:'woodcut', img:'photo-1596363505729-4190a9506133', o:{ ink:'#6E1423', paper:'#F1ECE2', lines:9, contrast:1.7, lift:-0.12 }, paper:'#F1ECE2', ink:'#6E1423', lay:'foot' },
  { kind:'riso', img:'photo-1567072629554-20e689de2400', o:{ a:'#2E3F8F', b:'#E47937', paper:'#F4F1EA', aLo:0.55 }, paper:'#F4F1EA', ink:'#2E3F8F', lay:'head' },
  { kind:'bubbles', paper:'#F4F1EA', ink:'#0F6E2B', lay:'across' },
  { kind:'cyanotype', img:'photo-1780124174184-cc9010541858', o:{ contrast:1.5, lift:0.06, margin:0 }, paper:'#F2EFE6', ink:'#0C2A63', lay:'side' },
  { kind:'screen', img:'photo-1694591933816-2c743377fdf8', o:{ ink:'#1A1614', paper:'#E9EFC4', cell:9, angle:15 }, paper:'#E9EFC4', ink:'#1A1614', lay:'head' },
  { kind:'xerox', img:'photo-1558138818-d44c4dea7a6a', o:{ ink:'#1A1614', paper:'#F2D9D2' }, paper:'#F2D9D2', ink:'#1A1614', lay:'foot' },
  { kind:'tiles', paper:'#F6F3EA', ink:'#1F4FA0', lay:'band' }
];
function makeLabel(i, w, pr){
  const L = LABELS[i], W = 1024, H = Math.round(W * (pr.H * 0.3) / ((pr.R + 0.004) * 2.4));
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  /* where the picture goes and where the words go, by layout */
  const R = { foot:[0, 0, W, H * 0.7], head:[0, H * 0.3, W, H * 0.7], side:[0, 0, W * 0.62, H], across:[0, 0, W, H], band:[0, 0, W, H] }[L.lay];
  function words(){
    g.fillStyle = L.ink; g.textAlign = 'center'; g.textBaseline = 'middle';
    const name = w[0].toUpperCase(), sub = w[1] + ', \u00a3' + w[2];
    const set = (t, x, y, px, sp) => { g.font = px + 'px "Libre Caslon Text", Georgia, serif'; g.letterSpacing = (sp || 0) + 'px'; g.fillText(t, x, y); };
    if (L.lay === 'foot'){ set(name, W / 2, H * 0.8, 64, 10); set(sub, W / 2, H * 0.92, 30, 3); }
    else if (L.lay === 'head'){ set(name, W / 2, H * 0.12, 60, 10); set(sub, W / 2, H * 0.23, 28, 3); }
    else if (L.lay === 'side'){ g.textAlign = 'left'; set(name, W * 0.66, H * 0.42, 54, 6); set(w[1], W * 0.66, H * 0.56, 30, 2); set('\u00a3' + w[2], W * 0.66, H * 0.66, 30, 2); }
    else if (L.lay === 'across'){ set(name, W / 2, H * 0.5, 120, 14); set(sub, W / 2, H * 0.68, 30, 3); }
    else { set(name, W / 2, H * 0.47, 70, 12); set(sub, W / 2, H * 0.6, 30, 3); }
  }
  function art(){
    let x = 9 + i * 13; const r = () => (x = (x * 16807) % 2147483647) / 2147483647;
    if (L.kind === 'bubbles'){ /* pet nat: bubbles rising, two drums out of register */
      for (let k = 0; k < 90; k++){ const bx = r() * W, by = H * (1 - Math.pow(r(), 0.7)), rad = 6 + r() * 34 * (1 - by / H + 0.3);
        if (Math.abs(by - H * 0.55) < H * 0.18 && Math.abs(bx - W / 2) < W * 0.42) continue;
        g.globalCompositeOperation = 'multiply';
        g.strokeStyle = '#F64FB2'; g.lineWidth = 5; g.beginPath(); g.arc(bx, by, rad, 0, 6.283); g.stroke();
        g.fillStyle = '#0F6E2B'; g.globalAlpha = 0.85; g.beginPath(); g.arc(bx + 6, by + 4, rad * 0.32, 0, 6.283); g.fill(); g.globalAlpha = 1; }
      g.globalCompositeOperation = 'source-over';
    } else if (L.kind === 'tiles'){ /* zibibbo: a stamped band of tiles, lemons on blue, top and bottom */
      const s = H * 0.3;
      [0, H - s].forEach((y0) => { for (let tx = 0; tx < W; tx += s){ g.fillStyle = '#1F4FA0'; g.globalAlpha = 0.86 + r() * 0.14; g.fillRect(tx + 3, y0 + 3, s - 6, s - 6);
        g.fillStyle = '#E8B923'; g.beginPath(); g.ellipse(tx + s / 2, y0 + s / 2, s * 0.24, s * 0.17, 0.5, 0, 6.283); g.fill();
        g.fillStyle = '#F6F3EA'; [[0,0],[s,0],[0,s],[s,s]].forEach((p) => { g.beginPath(); g.arc(tx + p[0], y0 + p[1], s * 0.16, 0, 6.283); g.fill(); }); } });
      g.globalAlpha = 1;
    }
    /* the paper's grain over everything */
    const im = g.getImageData(0, 0, W, H), d = im.data; for (let k = 0; k < d.length; k += 4){ const n = (r() - 0.5) * 16; d[k] += n; d[k + 1] += n; d[k + 2] += n; } g.putImageData(im, 0, 0);
  }
  g.fillStyle = L.paper; g.fillRect(0, 0, W, H);
  const fonts = document.fonts ? document.fonts.load('64px "Libre Caslon Text"') : Promise.resolve();
  if (L.img){
    Promise.all([loadImg(UN(L.img, 1200)), fonts]).then(([img]) => {
      const p = PRINT[L.kind](img, Math.round(R[2]), Math.round(R[3]), L.o);
      g.fillStyle = L.paper; g.fillRect(0, 0, W, H); g.drawImage(p, R[0], R[1]); art(); words(); tex.needsUpdate = true;
    }).catch(() => { fonts.then(() => { words(); tex.needsUpdate = true; }); });
  } else fonts.then(() => { art(); words(); tex.needsUpdate = true; });
  return tex;
}
const WINES = [['Gamay','Beaujolais',24,'#2b4a1f','serve it cold'],['Ribolla Gialla','Friuli',31,'#6a4a1a','orange, skins on'],['Pet nat','Loire',22,'#c9d1b0','cloudy on purpose'],['Trousseau','Jura',38,'#2b4a1f','pale and strange'],
  ['Riesling','Mosel',27,'#4f6a2a','bone dry'],['Cinsault','Swartland',21,'#3a2a14','cheapest, still good'],['Zibibbo','Sicily',29,'#c9d1b0','smells of flowers']];
/* no shelf: the bottles stand on the dark floor and only their shadows show it */

function profile(seed){
  let x = seed * 9301 + 49297; const r = () => (x = (x * 233280 + 49297) % 233280) / 233280;
  const H = 2.6 + r() * 0.6, R = 0.34 + r() * 0.08, sh = 0.55 + r() * 0.12, nk = 0.11 + r() * 0.03;
  const p = [new THREE.Vector2(0, 0), new THREE.Vector2(R * 0.92, 0), new THREE.Vector2(R, 0.08)];
  p.push(new THREE.Vector2(R, H * sh));
  for (let i = 1; i <= 8; i++){ const t = i / 8; p.push(new THREE.Vector2(R + (nk - R) * Math.sin(t * Math.PI / 2), H * sh + t * H * 0.18)); }
  p.push(new THREE.Vector2(nk, H * 0.94), new THREE.Vector2(nk * 1.15, H * 0.95), new THREE.Vector2(nk * 1.15, H), new THREE.Vector2(0, H));
  return { pts:p, H, R, sh };
}
const bottles = [];
WINES.forEach((w, i) => {
  const pr = profile(i + 3), g = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.LatheGeometry(pr.pts, 64), new THREE.MeshPhysicalMaterial({
    color:w[3], transmission:0.55, thickness:0.6, roughness:0.06, ior:1.5, metalness:0, clearcoat:1, clearcoatRoughness:0.05 }));
  glass.castShadow = true; g.add(glass);
  const lab = new THREE.Mesh(new THREE.CylinderGeometry(pr.R + 0.004, pr.R + 0.004, pr.H * 0.3, 64, 1, true, -1.2, 2.4),
    new THREE.MeshStandardMaterial({ map:makeLabel(i, w, pr), roughness:0.85 }));
  lab.position.y = pr.H * 0.28; g.add(lab);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.32, 32), new THREE.MeshStandardMaterial({ color:i % 2 ? '#7a1d18' : '#1A1614', roughness:0.4, metalness:0.3 }));
  cap.position.y = pr.H - 0.12; g.add(cap);
  const home = new THREE.Vector3(-3.9 + i * 1.3, 0, 0);
  g.position.copy(home); g.rotation.y = (i % 3 - 1) * 0.14;
  g.userData = { home, homeRot:g.rotation.y, w, H:pr.H };
  scene.add(g); bottles.push(g);
  /* the note, scratched on the floor in front of the bottle */
  const n = document.createElement('p'); n.className = 'n'; n.innerHTML = '&pound;' + w[2] + '<br>' + w[4];
  n.dataset.r = ((i * 37) % 7 - 3) * 1.4; document.body.appendChild(n); g.userData.note = n;
});
const pv = new THREE.Vector3(), pa = new THREE.Vector3(), pb = new THREE.Vector3();

let held = null, lx = 0, ly = 0, ry = 0, rx = 0;
const heldEl = document.getElementById('held');
addEventListener('pointerdown', (e) => {
  const hit = S.pick(e, bottles); if (!hit) return;
  let o = hit.object; while (o.parent && !bottles.includes(o)) o = o.parent;
  held = o; lx = e.clientX; ly = e.clientY; ry = 0.6; rx = 0;
  const w = held.userData.w; heldEl.textContent = w[0] + ', ' + w[1] + ', £' + w[2];
});
addEventListener('pointermove', (e) => { if (!held) return; ry += (e.clientX - lx) * 0.012; rx += (e.clientY - ly) * 0.006; rx = Math.max(-0.6, Math.min(0.6, rx)); lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => { held = null; heldEl.textContent = ''; });
const front = new THREE.Vector3(0, 1.05, 5.2), look = new THREE.Vector3(0, 1.4, 0);
let aspect = 0;
S.loop(() => {
  if (camera.aspect !== aspect){ aspect = camera.aspect; S.frameWidth(10.2, look); }
  bottles.forEach((b) => {
    const up = b === held, to = up ? front : b.userData.home;
    b.position.lerp(to, 0.12);
    const ty = up ? ry : b.userData.homeRot, tx = up ? rx : 0;
    b.rotation.y += (ty - b.rotation.y) * 0.18; b.rotation.x += (tx - b.rotation.x) * 0.18;
    const n = b.userData.note; pv.copy(b.userData.home); pv.z += 0.75; pv.project(camera);
    /* each note gets the width between two bottles and no more, so neighbours never touch */
    pa.copy(bottles[0].userData.home).project(camera); pb.copy(bottles[1].userData.home).project(camera);
    const gap = Math.abs(pb.x - pa.x) / 2 * innerWidth;
    n.style.width = Math.max(40, gap * 0.86).toFixed(0) + 'px'; n.style.fontSize = Math.max(15, Math.min(24, gap / 6.4)).toFixed(1) + 'px';
    n.style.transform = 'translate(' + ((pv.x + 1) / 2 * innerWidth).toFixed(1) + 'px,' + ((1 - pv.y) / 2 * innerHeight).toFixed(1) + 'px) translateX(-50%) rotate(' + n.dataset.r + 'deg)';
    n.style.opacity = up ? 0 : 1;
  });
});
</script></body></html>
