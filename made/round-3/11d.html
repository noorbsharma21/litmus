<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low Tide Records</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Libre+Franklin:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<!-- 11d. An independent record label. Round three, from 11c. cr6: the 3D was
     realistic but not finished enough, so it read as old internet; the type
     sat on the player again; the faces were the same as everywhere else. No
     3D model now. The releases are sleeves in a crate, each cover a two ink
     riso print made in the page from a photograph, the title printed into it.
     Scroll or drag to flip through; click the sleeve at the front and its
     record slides out and plays. The music is generated here, a placeholder. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#F1EFEA;font-family:"Libre Franklin",Helvetica,sans-serif;color:#1A1614;user-select:none;-webkit-user-select:none;touch-action:none}
#crate{position:fixed;left:4vw;width:min(54vw,74vh);bottom:6vh;top:14vh;perspective:1600px;perspective-origin:50% 0%}
.sl{position:absolute;left:0;right:0;bottom:0;aspect-ratio:1;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.3,.7,.2,1),filter .55s;box-shadow:0 2px 0 rgba(0,0,0,.12),0 18px 30px rgba(0,0,0,.14);cursor:pointer;background:#ddd}
.sl canvas{width:100%;height:100%;display:block}
#disc{position:fixed;border-radius:50%;pointer-events:none;transition:transform .9s cubic-bezier(.3,.7,.2,1);
  background:radial-gradient(circle,#ccc 0 1.2%,var(--lab,#F64FB2) 1.3% 17%,#141210 17.3% 100%);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#disc::after{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);mask:radial-gradient(circle,transparent 18%,#000 18.5%);-webkit-mask:radial-gradient(circle,transparent 18%,#000 18.5%)}
aside{position:fixed;right:40px;top:40px;bottom:40px;width:min(300px,30vw);display:flex;flex-direction:column}
h1{margin:0;font-family:"Bowlby One SC",sans-serif;font-weight:normal;font-size:30px;line-height:.95}
.sub{margin:10px 0 0;font-size:14px;line-height:1.45}
#info{margin-top:auto}
#info h2{margin:0;font-family:"Bowlby One SC",sans-serif;font-weight:normal;font-size:22px;line-height:1}
#info p{margin:6px 0 0;font-size:14px;line-height:1.45}
#info .st{font-style:italic;margin-top:14px}
ol{margin:18px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.7;counter-reset:n}
ol li{counter-increment:n;cursor:pointer;opacity:.55}
ol li::before{content:counter(n) '  ';font-weight:600}
ol li.on{opacity:1;font-weight:600}
@media (max-width:820px){ #crate{left:6vw;width:70vw;top:30vh} aside{left:6vw;right:6vw;width:auto;top:20px;bottom:auto} #info{display:none} }
</style></head><body>
<div id="crate" role="listbox" aria-label="Releases"></div>
<div id="disc" aria-hidden="true"></div>
<aside>
<h1>Low Tide<br>Records</h1>
<p class="sub">Small runs, pressed in Leeds.<br>Six records so far.</p>
<div id="info" aria-live="polite"><h2></h2><p></p><p class="st"></p><ol id="list"></ol></div>
</aside>
<script src="../round-2/images.js"></script>
<script src="print.js"></script>
<script>
grainOver(0.06, 'multiply');
/* each release: artist, title, two inks, the photograph its cover is printed from, the notes of its loop */
var R = [['Ama Bell','Night Ferry','#1A1614','#F64FB2',IMG.fog[1],[0,3,7,10]],['Corran','Field Recordings 2','#0F6E2B','#E47937',IMG.porto[2],[0,2,7,9]],
  ['Sile and Ott','Glass House','#3866C1','#F64FB2',IMG.flower[0],[0,4,7,11]],['Mo Arendt','Tidewater','#072493','#88B7D3',IMG.prints[0],[0,3,5,10]],
  ['Nils Pa','Low Light','#A40603','#FCF02A',IMG.dance[1],[0,5,7,12]],['Hester','Salt Road','#1A1614','#E47937',IMG.type[1],[0,3,8,10]]];
var crate = document.getElementById('crate'), disc = document.getElementById('disc'), list = document.getElementById('list'), cur = 0, playing = -1;
var sleeves = R.map(function(r, i){
  var el = document.createElement('div'); el.className = 'sl'; el.setAttribute('role', 'option'); el.setAttribute('aria-label', r[0] + ', ' + r[1]);
  var c = document.createElement('canvas'); c.width = c.height = 700; el.appendChild(c); crate.appendChild(el);
  list.insertAdjacentHTML('beforeend', '<li data-i="' + i + '">' + r[0] + ', <i>' + r[1] + '</i></li>');
  return { el:el, c:c };
});
/* print each cover: the photograph through two drums, then the title in the first ink, a hair out of register */
function cover(i){
  var r = R[i], s = sleeves[i];
  loadImg(U(r[4], 900)).then(function(img){
    var p = PRINT.riso(img, 700, 700, { a:r[2], b:r[3], paper:'#F4F1EA', seed:i + 3, aLo:0.66, aHi:1, bLo:0.12, bHi:0.7, lift:0.12 });
    var g = s.c.getContext('2d'); g.drawImage(p, 0, 0);
    g.globalCompositeOperation = 'multiply'; g.fillStyle = r[2];
    g.font = '64px "Bowlby One SC"'; g.textBaseline = 'alphabetic';
    var words = r[1].toUpperCase().split(' '), y = 640 - (words.length - 1) * 60;
    words.forEach(function(w, k){ g.fillText(w, 38, y + k * 60); });
    g.font = '600 26px "Libre Franklin"'; g.fillText(r[0], 40, 72);
    g.fillStyle = r[3]; g.globalAlpha = 0.85; g.font = '64px "Bowlby One SC"';
    words.forEach(function(w, k){ g.fillText(w, 42, y + k * 60 + 3); });
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }).catch(function(){});
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){ R.forEach(function(_, i){ cover(i); }); });
/* the crate: sleeves already flipped lean toward you, the front one stands, the rest wait behind */
function lay(){
  sleeves.forEach(function(s, i){
    var d = i - cur, t;
    if (d < 0) t = 'translateZ(' + (40 - d * 6) + 'px) rotateX(-78deg)';
    else if (d === 0) t = 'translateZ(0) rotateX(-6deg)';
    else t = 'translateZ(' + (-d * 46) + 'px) translateY(' + (-d * 16) + 'px) rotateX(-6deg)';
    s.el.style.transform = t; s.el.style.zIndex = 100 - Math.abs(d) - (d < 0 ? 50 : 0);
    s.el.style.filter = d > 0 ? 'brightness(' + (1 - d * 0.06) + ')' : 'none';
  });
  [].forEach.call(list.children, function(li, i){ li.className = i === cur ? 'on' : ''; });
  var r = R[cur], info = document.getElementById('info');
  info.querySelector('h2').textContent = r[1]; info.querySelector('p').textContent = r[0] + ', twelve inch, edition of 300';
  info.querySelector('.st').textContent = playing === cur ? 'playing' : '';
  if (playing !== cur) put(false);
}
/* the record: tucked in its sleeve, or out to the right and turning */
var spin = 0;
function put(out){
  var b = sleeves[cur].el.getBoundingClientRect(), d = b.width * 0.94;
  disc.style.width = disc.style.height = d + 'px'; disc.style.left = (b.left + b.width * 0.03) + 'px'; disc.style.top = (b.top + b.height * 0.03) + 'px';
  disc.style.setProperty('--lab', R[cur][3]);
  disc.style.zIndex = out ? 1 : 0; crate.style.zIndex = out ? 2 : 2;
  disc.dataset.out = out ? 1 : 0;
}
var wheelAcc = 0;
addEventListener('wheel', function(e){ wheelAcc += e.deltaY; if (Math.abs(wheelAcc) > 60){ cur = Math.max(0, Math.min(R.length - 1, cur + Math.sign(wheelAcc))); wheelAcc = 0; lay(); } }, { passive:true });
var dy = null;
crate.addEventListener('pointerdown', function(e){ dy = e.clientY; });
addEventListener('pointerup', function(e){
  if (dy === null) return; var m = e.clientY - dy; dy = null;
  if (Math.abs(m) > 30){ cur = Math.max(0, Math.min(R.length - 1, cur + (m < 0 ? 1 : -1))); lay(); return; }
  var hit = e.target.closest && e.target.closest('.sl'); if (!hit) return;
  var i = sleeves.findIndex(function(s){ return s.el === hit; });
  if (i !== cur){ cur = i; lay(); return; }
  if (playing === cur){ playing = -1; stop(); } else { playing = cur; play(); }
  lay();
});
list.addEventListener('click', function(e){ var li = e.target.closest('li'); if (li){ cur = +li.dataset.i; lay(); } });
addEventListener('keydown', function(e){ if (e.key === 'ArrowDown' || e.key === 'ArrowRight') cur = Math.min(R.length - 1, cur + 1); if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') cur = Math.max(0, cur - 1); if (e.key === 'Enter'){ playing = playing === cur ? -1 : cur; playing < 0 ? stop() : play(); } lay(); });
/* the sound: a small loop for each release, generated */
var A = null, master = null, step = 0, next = 0;
function play(){
  if (!A){ A = new (window.AudioContext || window.webkitAudioContext)(); master = A.createGain(); master.gain.value = 0.3; master.connect(A.destination); }
  A.resume(); next = A.currentTime + 0.05;
}
function stop(){ }
function note(f, when, len, type, vol){ var o = A.createOscillator(), g = A.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, when + len); o.connect(g); g.connect(master); o.start(when); o.stop(when + len + 0.02); }
(function loop(){
  if (A && playing >= 0){ while (next < A.currentTime + 0.1){ var sc = R[playing][5], base = 110 * Math.pow(2, (step % 16 < 8 ? 0 : -2) / 12);
    if (step % 4 === 0) note(base / 2, next, 0.35, 'sine', 0.5); note(base * 2 * Math.pow(2, sc[step % 4] / 12), next, 0.18, 'triangle', 0.18); step++; next += 0.16; } }
  var out = disc.dataset.out === '1', want = playing === cur && playing >= 0;
  if (want !== out) put(want);
  var b = sleeves[cur].el.getBoundingClientRect();
  spin += want ? 3.2 : 0;
  disc.style.transform = 'translateX(' + (want ? b.width * 0.52 : 0) + 'px) rotate(' + spin + 'deg)';
  requestAnimationFrame(loop);
})();
lay();
</script></body></html>
