<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stem and Hour</title>
<link href="https://fonts.googleapis.com/css2?family=Linden+Hill:ital@0;1&family=Zeyada&display=swap" rel="stylesheet">
<!-- 13d. A florist. Round three, from 13c. cr6 liked it but could not tell
     what the movement tells you. Now it builds a bunch. Each click drops the
     next of today's stems into the vase, and its name and price are written
     where it falls; the tag tied to the vase keeps the tally in pencil, so
     whatever you have dropped is an order you could ring through. Pick a stem
     up and throw it out and it comes off the tag. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#EE5884;font-family:"Linden Hill",Georgia,serif;color:#072493;touch-action:none;user-select:none;-webkit-user-select:none}
.head{position:fixed;left:32px;top:28px;margin:0;z-index:3;pointer-events:none;max-width:300px}
.head h1{margin:0;font-weight:normal;font-size:30px;line-height:1}
.head p{margin:8px 0 0;font-size:17px;line-height:1.4}
.head i{font-style:italic}
.st{position:fixed;left:0;top:0;width:8px;background:#0F6E2B;transform-origin:50% 0;pointer-events:none;z-index:1}
.fl{position:fixed;left:0;top:0;border-radius:50%;object-fit:cover;pointer-events:none;box-shadow:0 0 0 4px #EE5884;z-index:3}
#vase{position:fixed;pointer-events:none;background:#072493;z-index:2}
/* the name of a stem, written where it lands, then fading */
.say{position:fixed;left:0;top:0;margin:0;font-family:"Zeyada",cursive;font-size:30px;color:#072493;pointer-events:none;z-index:4;white-space:nowrap;transition:opacity 1.6s 1.2s}
/* the tag tied to the vase: the tally */
#tag{position:fixed;z-index:4;margin:0;padding:14px 18px 16px;background:#F7F4EC;color:#1A1614;font-family:"Zeyada",cursive;font-size:24px;line-height:1.15;transform:rotate(-4deg);box-shadow:0 2px 6px rgba(7,36,147,.18);min-width:150px;pointer-events:none}
#tag b{display:block;font-weight:normal;font-size:28px;margin-top:6px;border-top:1px solid rgba(26,22,20,.4);padding-top:4px}
#string{position:fixed;height:1px;background:#1A1614;transform-origin:0 0;z-index:3;pointer-events:none;opacity:.7}
</style></head><body>
<div class="head"><h1>Stem and Hour</h1><p>Cut this morning. Open Tuesday to Saturday, <i>eight until six</i>.</p></div>
<div id="vase" aria-hidden="true"></div>
<div id="string" aria-hidden="true"></div>
<p id="tag" aria-live="polite"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="../round-2/images.js"></script>
<script src="print.js"></script>
<script>
grainOver(0.12, 'overlay');
/* today's stems, each with its photograph and its price */
var TODAY = [['anemone', 3], ['ranunculus', 4], ['tulip', 2.5], ['sweet pea', 3.5], ['cosmos', 2]];
var M = Matter, eng = M.Engine.create(), world = eng.world;
eng.gravity.y = 1.1;
var W = innerWidth, H = innerHeight, vase = document.getElementById('vase'), tag = document.getElementById('tag'), str = document.getElementById('string'), parts = [];
var vw = Math.min(360, W * 0.34), vh = Math.min(300, H * 0.36), vx = W * 0.58, vy = H - vh;
vase.style.cssText += ';left:' + (vx - vw / 2) + 'px;top:' + vy + 'px;width:' + vw + 'px;height:' + vh + 'px;border-radius:0 0 46% 46% / 0 0 30% 30%';
tag.style.left = Math.min(W - 200, vx + vw / 2 + 60) + 'px'; tag.style.top = (vy + 40) + 'px';
var walls = [
  M.Bodies.rectangle(vx - vw / 2, vy + vh / 2, 16, vh, { isStatic:true }),
  M.Bodies.rectangle(vx + vw / 2, vy + vh / 2, 16, vh, { isStatic:true }),
  M.Bodies.rectangle(vx, H + 8, vw, 30, { isStatic:true }),
  M.Bodies.rectangle(W / 2, H + 60, W * 3, 100, { isStatic:true }),
  M.Bodies.rectangle(-50, H / 2, 100, H * 3, { isStatic:true }),
  M.Bodies.rectangle(W + 50, H / 2, 100, H * 3, { isStatic:true })
];
M.Composite.add(world, walls);
var k = 0;
function drop(x){
  /* stems longer than the vase is deep, so the heads stand above its rim */
  var kind = k % TODAY.length, r = 34 + Math.random() * 18, len = vh + 90 + Math.random() * 140;
  var body = M.Bodies.rectangle(x, -len, 10, len, { density:0.0016, friction:0.6, frictionAir:0.02, chamfer:{ radius:4 } });
  M.Body.setAngle(body, (Math.random() - .5) * 0.6);
  M.Composite.add(world, body);
  var st = document.createElement('div'); st.className = 'st'; st.style.height = len + 'px'; document.body.appendChild(st);
  var fl = document.createElement('img'); fl.className = 'fl'; fl.alt = TODAY[kind][0]; fl.src = U(IMG.flower[kind % IMG.flower.length], 300);
  fl.style.width = fl.style.height = (r * 2) + 'px'; document.body.appendChild(fl);
  var say = document.createElement('p'); say.className = 'say'; say.textContent = TODAY[kind][0] + ', £' + money(TODAY[kind][1]); document.body.appendChild(say);
  var p = { b:body, st:st, fl:fl, r:r, len:len, kind:kind, say:say, born:performance.now() };
  parts.push(p); k++;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ say.style.opacity = 0; }); });
  setTimeout(function(){ say.remove(); p.say = null; }, 3200);
}
function money(v){ return v % 1 ? v.toFixed(2) : String(v); }
/* the tally: only stems that are actually in the vase count */
function inVase(p){ var c = p.b.position; return c.x > vx - vw / 2 && c.x < vx + vw / 2 && c.y > vy - p.len * 0.6; }
function tally(){
  var n = {}, total = 0, count = 0;
  parts.forEach(function(p){ if (!inVase(p)) return; n[p.kind] = (n[p.kind] || 0) + 1; total += TODAY[p.kind][1]; count++; });
  if (!count){ tag.innerHTML = 'nothing in yet'; return; }
  tag.innerHTML = Object.keys(n).map(function(i){ var c = n[i], name = TODAY[i][0]; return c + ' ' + (c > 1 ? (name === 'sweet pea' ? 'sweet peas' : name === 'cosmos' ? 'cosmos' : name + 's') : name); }).join('<br>') +
    '<b>£' + money(total) + ', ready at four</b>';
}
var mouse = M.Mouse.create(document.body), mc = M.MouseConstraint.create(eng, { mouse:mouse, constraint:{ stiffness:0.2 } });
M.Composite.add(world, mc);
var downAt = null;
addEventListener('pointerdown', function(e){ downAt = [e.clientX, e.clientY, M.Query.point(parts.map(function(p){ return p.b; }), { x:e.clientX, y:e.clientY }).length]; });
addEventListener('pointerup', function(e){ if (downAt && !downAt[2] && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 6) drop(e.clientX); downAt = null; });
/* ?still settles the first stems before the page shows, for photographing it */
if (new URLSearchParams(location.search).has('still')){
  for (var i = 0; i < 5; i++){ drop(vx + (i - 2) * vw * 0.12); for (var j = 0; j < 90; j++) M.Engine.update(eng, 1000 / 60); }
  for (var j = 0; j < 240; j++) M.Engine.update(eng, 1000 / 60);
} else for (var i = 0; i < 3; i++) setTimeout(function(){ drop(vx + (Math.random() - .5) * vw * 0.5); }, 300 + i * 450);
var last = 0, prev = 0;
(function tick(t){
  /* physics on the clock, so a slow machine sees the stems land at the same pace */
  var steps = prev ? Math.max(1, Math.min(6, Math.round((t - prev) / 16.67))) : 1; prev = t;
  for (var s = 0; s < steps; s++) M.Engine.update(eng, 1000 / 60);
  parts.forEach(function(p){
    var a = p.b.angle, c = p.b.position, tx = c.x + Math.sin(a) * p.len / 2, ty = c.y - Math.cos(a) * p.len / 2;
    p.st.style.transform = 'translate(' + (tx - 4) + 'px,' + ty + 'px) rotate(' + (a * 180 / Math.PI) + 'deg)';
    p.fl.style.transform = 'translate(' + (tx - p.r) + 'px,' + (ty - p.r) + 'px)';
    if (p.say) p.say.style.transform = 'translate(' + (tx + p.r + 10) + 'px,' + (ty - 20) + 'px) rotate(-6deg)';
  });
  /* the string from the vase's neck to its tag */
  var x0 = vx + vw / 2 - 6, y0 = vy + 14, x1 = parseFloat(tag.style.left) + 10, y1 = parseFloat(tag.style.top) + 18;
  str.style.left = x0 + 'px'; str.style.top = y0 + 'px'; str.style.width = Math.hypot(x1 - x0, y1 - y0) + 'px';
  str.style.transform = 'rotate(' + Math.atan2(y1 - y0, x1 - x0) + 'rad)';
  if (!last || t - last > 300){ tally(); last = t; }
  requestAnimationFrame(tick);
})(0);
</script></body></html>
