<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Saturday in Porto</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<!-- 05d. A weekend guide to a city. Round three, from 05c. cr6 kept the sun,
     wanted 05a's journey path in it, a face that does not read as AI, and
     framing and effects past the basics. The photograph sits in a border of
     painted blue and white tiles, the city's own; the day's route is drawn
     over it, stop to stop, and a walker follows the sun along it. The
     itinerary sits beside the picture, not on it: drag the sun, or pick a
     stop, and the light, the walker and the list all move to that hour. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#F4F5F2;font-family:"Sorts Mill Goudy",Georgia,serif;color:#16305E;user-select:none;-webkit-user-select:none}
#frame{position:fixed;left:30px;top:30px;bottom:30px;width:calc(66vw - 30px);background-size:38px 38px;box-shadow:0 1px 3px rgba(22,48,94,.2)}
#pic{position:absolute;inset:38px;overflow:hidden;background:#222}
#ph{position:absolute;inset:0;background-size:cover;background-position:center 60%}
#tint{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none}
#route{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.n{position:absolute;margin:0;font-family:"Nothing You Could Do",cursive;font-size:19px;color:#fff;transform:translate(8px,-26px);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#walker{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35);pointer-events:none}
#sun{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:#FCF02A;cursor:grab;touch-action:none;box-shadow:0 0 30px 6px rgba(252,240,42,.35)}
#sun:focus-visible{outline:2px solid #fff;outline-offset:4px}
aside{position:fixed;top:30px;bottom:30px;right:30px;left:calc(66vw + 30px);display:flex;flex-direction:column}
h1{margin:0;font-weight:normal;font-size:30px;line-height:1.05}
.sub{margin:8px 0 0;font-size:16px;font-style:italic}
ol{margin:auto 0 0;padding:0;list-style:none;font-size:17px;line-height:1.35}
ol li{display:grid;grid-template-columns:3.6em 1fr;padding:6px 0;border-top:1px solid rgba(22,48,94,.2);cursor:pointer;transition:color .3s}
ol li b{font-weight:normal;font-variant-numeric:oldstyle-nums}
ol li.past{color:rgba(22,48,94,.45)}
ol li.now{font-style:italic}
ol li.now b::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#E4A400;margin:0 6px 1px -15px}
@media (max-width:860px){ #frame{width:auto;right:16px;left:16px;top:16px;bottom:auto;height:52vh} aside{left:16px;right:16px;top:calc(52vh + 30px);bottom:16px} ol{font-size:15px} }
</style></head><body>
<div id="frame"><div id="pic">
  <div id="ph" role="img" aria-label="The river and the city of Porto"></div><div id="tint"></div>
  <svg id="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path id="rp" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".85"/>
    <path id="rd" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>
  <div id="walker"></div>
  <div id="sun" tabindex="0" role="slider" aria-label="Time of day" aria-valuemin="7" aria-valuemax="24"></div>
</div></div>
<aside>
  <h1>A Saturday in Porto</h1>
  <p class="sub">from the first coffee to the last tram</p>
  <ol id="list"></ol>
</aside>
<script src="../round-2/images.js"></script>
<script src="print.js"></script>
<script>
grainOver(0.08, 'multiply');
/* the tiles: cobalt painted on white glaze, by hand, so no two quite agree */
(function tiles(){
  var c = document.createElement('canvas'), N = 152; c.width = c.height = N; var g = c.getContext('2d'), r = seeded(12);
  g.fillStyle = '#F3F5F7'; g.fillRect(0, 0, N, N);
  var B = '#1F4FA0';
  function blob(x, y, rx, ry, a){ g.save(); g.translate(x, y); g.rotate(a || 0); g.globalAlpha = 0.78 + r() * 0.22; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 6.283); g.fill(); g.restore(); }
  g.fillStyle = B;
  [[0,0],[N,0],[0,N],[N,N]].forEach(function(p){ g.globalAlpha = 0.85; g.beginPath(); g.arc(p[0], p[1], N * 0.3, 0, 6.283); g.fill(); });
  g.fillStyle = '#F3F5F7'; [[0,0],[N,0],[0,N],[N,N]].forEach(function(p){ g.beginPath(); g.arc(p[0], p[1], N * 0.2, 0, 6.283); g.fill(); });
  g.fillStyle = B;
  for (var i = 0; i < 8; i++){ var a = i / 8 * 6.283; blob(N / 2 + Math.cos(a) * N * 0.18, N / 2 + Math.sin(a) * N * 0.18, N * 0.1, N * 0.045, a); }
  blob(N / 2, N / 2, N * 0.07, N * 0.07);
  g.fillStyle = '#F3F5F7'; blob(N / 2, N / 2, N * 0.03, N * 0.03);
  g.strokeStyle = B; g.lineWidth = 2; g.globalAlpha = 0.6; g.strokeRect(1, 1, N - 2, N - 2);
  var d = g.getImageData(0, 0, N, N); for (var k = 0; k < d.data.length; k += 4){ var n = (r() - 0.5) * 14; d.data[k] += n; d.data[k + 1] += n; d.data[k + 2] += n; } g.putImageData(d, 0, 0);
  document.getElementById('frame').style.backgroundImage = 'url(' + c.toDataURL() + ')';
})();
document.getElementById('ph').style.backgroundImage = 'url(' + U(IMG.porto[0], 2000) + ')';
/* the day: hour, place, and where it sits on the picture (0 to 100 across and down) */
var STOPS = [[7, 'Coffee standing at the counter', 14, 70], [9, 'Bolhão market, before it fills', 30, 58], [11, 'Ribeira, along the river', 44, 80],
  [14, 'The little ferry to Afurada', 22, 88], [17, 'Serralves, the garden', 62, 62], [19.5, 'Grilled sardines in the street', 74, 74],
  [22, 'Foz, the sea at dark', 88, 66], [23.5, 'The last tram up the hill', 80, 46]];
var pic = document.getElementById('pic'), ph = document.getElementById('ph'), tint = document.getElementById('tint'), sun = document.getElementById('sun');
var walker = document.getElementById('walker'), list = document.getElementById('list'), rp = document.getElementById('rp'), rd = document.getElementById('rd');
/* the route: a wandering line through the stops, the way a walk goes */
var R = seeded(5), pts = [];
STOPS.forEach(function(s, i){
  if (i){ var p = STOPS[i - 1]; for (var k = 1; k < 6; k++){ var f = k / 6; pts.push([p[2] + (s[2] - p[2]) * f + (R() - 0.5) * 4, p[3] + (s[3] - p[3]) * f + (R() - 0.5) * 4, i - 1 + f]); } }
  pts.push([s[2], s[3], i]);
});
rp.setAttribute('d', pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(''));
STOPS.forEach(function(s, i){
  var n = document.createElement('p'); n.className = 'n'; n.textContent = i + 1; n.style.left = s[2] + '%'; n.style.top = s[3] + '%'; pic.appendChild(n);
  var li = document.createElement('li'); var hh = Math.floor(s[0]), mm = Math.round((s[0] % 1) * 60);
  li.innerHTML = '<b>' + hh + (mm ? '.' + mm : '') + '</b><span>' + s[1] + '</span>'; li.dataset.i = i; list.appendChild(li);
});
var h = 9;
function at(hour){ /* how far along the route the walker is at this hour */
  if (hour <= STOPS[0][0]) return 0;
  for (var i = 1; i < STOPS.length; i++) if (hour < STOPS[i][0]) return i - 1 + (hour - STOPS[i - 1][0]) / (STOPS[i][0] - STOPS[i - 1][0]);
  return STOPS.length - 1;
}
function render(){
  var r = pic.getBoundingClientRect(); if (!r.width) return;
  var t = (h - 7) / 17, sx = 6 + t * 88, sy = 62 - Math.sin(t * Math.PI) * 50;
  sun.style.left = sx + '%'; sun.style.top = sy + '%';
  var noon = Math.sin(t * Math.PI), late = Math.max(0, (h - 20) / 4);
  ph.style.filter = 'brightness(' + (0.5 + noon * 0.65 - late * 0.3).toFixed(2) + ') saturate(' + (0.7 + noon * 0.5).toFixed(2) + ')';
  tint.style.background = h < 9 ? 'rgba(238,88,132,' + ((9 - h) / 2 * 0.4).toFixed(2) + ')' : h > 17 ? 'rgba(' + (h > 20 ? '7,36,147' : '228,121,55') + ',' + Math.min(0.7, (h - 17) / 5).toFixed(2) + ')' : 'rgba(0,0,0,0)';
  sun.style.background = h > 21 ? '#C9D8EA' : (h > 18 || h < 8 ? '#F2A33A' : '#FCF02A');
  /* the walker and the part of the route already walked */
  var a = at(h), done = pts.filter(function(p){ return p[2] <= a; }), last = done[done.length - 1] || pts[0];
  var nx = pts[Math.min(pts.length - 1, done.length)] || last, f = nx === last ? 0 : (a - last[2]) / Math.max(0.001, nx[2] - last[2]);
  var wx = last[0] + (nx[0] - last[0]) * f, wy = last[1] + (nx[1] - last[1]) * f;
  walker.style.left = wx + '%'; walker.style.top = wy + '%';
  rd.setAttribute('d', done.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join('') + (done.length ? 'L' + wx.toFixed(1) + ' ' + wy.toFixed(1) : ''));
  var cur = Math.min(STOPS.length - 1, Math.floor(a + 0.25));
  [].forEach.call(list.children, function(li, i){ li.className = i < cur ? 'past' : i === cur ? 'now' : ''; });
  var hh = Math.floor(h), mm = Math.floor((h % 1) * 4) * 15;
  sun.setAttribute('aria-valuenow', hh); sun.setAttribute('aria-valuetext', hh + ':' + (mm < 10 ? '0' : '') + mm + ', ' + STOPS[cur][1]);
}
var drag = false;
sun.addEventListener('pointerdown', function(e){ drag = true; sun.setPointerCapture(e.pointerId); sun.style.cursor = 'grabbing'; });
addEventListener('pointermove', function(e){ if (!drag) return; var r = pic.getBoundingClientRect(); h = 7 + 17 * Math.max(0, Math.min(1, ((e.clientX - r.left) / r.width - 0.06) / 0.88)); render(); });
addEventListener('pointerup', function(){ drag = false; sun.style.cursor = 'grab'; });
sun.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight') h = Math.min(24, h + 0.5); if (e.key === 'ArrowLeft') h = Math.max(7, h - 0.5); render(); });
/* pick a stop and the day eases there */
var goal = null;
list.addEventListener('click', function(e){ var li = e.target.closest('li'); if (li) goal = STOPS[+li.dataset.i][0] + 0.01; });
(function loop(){ if (goal !== null){ h += (goal - h) * 0.08; if (Math.abs(goal - h) < 0.02){ h = goal; goal = null; } render(); } requestAnimationFrame(loop); })();
addEventListener('resize', render);
(function wait(){ if (pic.getBoundingClientRect().width) render(); else requestAnimationFrame(wait); })();
</script></body></html>
