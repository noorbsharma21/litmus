<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A weekend in Porto</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<!-- 05d. A weekend guide to Porto, as a travel sketchbook. After cr17
     ("while I like this, I liked the use of image, and the lines here are too
     sharp; we can do better with the design"). The traditional method is
     the travel sketchbook: on one page a watercolour and ink map of the city,
     soft washes for the river, the sea and the gardens, every line gone over
     in ink that bleeds a little; on the other, a photograph of where you are
     right now with the hour written under it by hand. Drag the sun along the
     hours and you walk the route on the map while the photographs change
     with each stop. Each day ends on walking it in Google Maps. Kept from
     cr16: the map, the numbered stops, the strip of hours. Photographs are
     Unsplash placeholders, hotlinked. -->
<style>
:root{--ink:#1B2F57;--blue:#2D5AA8;--sun:#E89A3C}
html,body{margin:0;background:#FFFFFF;color:var(--ink);font-family:"Sorts Mill Goudy",Georgia,serif}
.wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:22px 46px;padding:28px 34px 44px;max-width:1500px;margin:0 auto;align-items:start}
header{grid-column:1 / -1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:14px 30px}
h1{margin:0;font-weight:normal;font-size:clamp(28px,3vw,42px);line-height:1.05}
.sub{margin:6px 0 0;font-size:17px;max-width:42ch;line-height:1.35}
.days{display:flex;gap:28px}
.days a{position:relative;font-family:"Nothing You Could Do",cursive;font-size:25px;text-decoration:none;color:var(--ink);padding:6px 2px;min-height:44px;display:inline-block}
.days a .scrib{position:absolute;left:-6%;bottom:2px;width:112%;height:12px;opacity:0;overflow:visible}
.days a.on .scrib{opacity:1}
.days a:focus-visible,.take:focus-visible,.stop:focus-visible,#sun:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.left{position:sticky;top:14px}
.hours{position:relative;height:74px;touch-action:none;cursor:grab}
.hours svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#sun{position:absolute;top:13px;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#FBE38A,#F2B04A 70%);cursor:grab;filter:url(#bleed)}
.hours .tick{position:absolute;bottom:2px;transform:translateX(-50%);font-family:"Nothing You Could Do",cursive;font-size:15px;white-space:nowrap}
.drag{position:absolute;left:0;top:-6px;font-family:"Nothing You Could Do",cursive;font-size:16px;opacity:.7}
#map{display:block;width:100%;height:auto}
.snap{position:relative;aspect-ratio:4/3;overflow:hidden;background:#EEF2F8}
.snap div{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .7s}
.snap div.on{opacity:1}
.snap .light{opacity:1;mix-blend-mode:multiply;pointer-events:none;transition:background .4s}
.cap{display:flex;gap:16px;align-items:baseline;margin:14px 0 0}
.cap .t{font-family:"Nothing You Could Do",cursive;font-size:30px;line-height:1;flex:none}
.cap b{font-weight:normal;font-size:24px;line-height:1.15}
.what{margin:6px 0 0;font-size:17px;line-height:1.45;max-width:40ch}
ol{list-style:none;margin:26px 0 0;padding:0}
.stop{display:grid;grid-template-columns:64px 22px 3.2em minmax(0,1fr);gap:12px;align-items:center;padding:8px 2px 10px;cursor:pointer;position:relative;transition:opacity .3s}
.stop img{width:64px;height:48px;object-fit:cover;display:block}
.stop .num{font-family:"Nothing You Could Do",cursive;font-size:17px}
.stop .tm{font-size:16px}
.stop .nm{font-size:17px;line-height:1.25}
.stop .scrib{position:absolute;left:0;right:0;bottom:-4px;width:100%;height:10px;overflow:visible;opacity:.35}
.stop.past{opacity:.5}
.stop.on .num{color:var(--sun)}
.take{position:relative;display:inline-block;margin-top:20px;font-family:"Nothing You Could Do",cursive;font-size:23px;color:var(--ink);text-decoration:none;padding:10px 2px;min-height:44px}
.take .scrib{position:absolute;left:-4%;bottom:2px;width:108%;height:12px;overflow:visible}
@media (max-width:900px){ .wrap{grid-template-columns:1fr;padding:18px 16px 30px} .left{position:static} .snap{aspect-ratio:4/3} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

</div>
