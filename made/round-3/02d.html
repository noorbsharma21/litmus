<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arda</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap" rel="stylesheet">
<!-- 02d. A chef's eight course tasting menu. cr9: the photographs still read as
     cut up; each dish is now taken off its background and set on the page's
     white at one size, like the others. Lessons from 01 applied before
     review (cr7, cr8): no italics, a white ground, the facts in one block, and
     the eight photographs made one system: all taken from above, each cropped
     to its own plate's rim so every course sits on the same circle. Round
     three, from 02a, which cr6
     thought could have been fun, after 02c was refused: too basic, the colour
     changing from course to course, too much scroll. One screen, one plate,
     one palette. The eight courses are written round the rim of the table in
     a ring, like the hours on a clock; move round the plate and each course
     arrives on it in turn, its name darkening on the ring. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#FFFFFF;font-family:"Bodoni Moda",Georgia,serif;color:#211A16;user-select:none;-webkit-user-select:none}
#plate{position:fixed;left:var(--cx,50%);top:var(--cy,50%);width:var(--d);height:var(--d);transform:translate(-50%,-50%)}
/* each dish taken off its photographed table and set on the page's white, all at one size */
#plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .7s;filter:drop-shadow(0 22px 22px rgba(33,26,22,.16)) drop-shadow(0 3px 4px rgba(33,26,22,.1))}
#plate img.on{opacity:1}
#ring{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}
#ring text{font-size:var(--fs);fill:#211A16;opacity:.32;transition:opacity .4s}
#ring text.on{opacity:1}
.c{position:fixed;margin:0;font-size:15px;line-height:1.5}
.c.tl{left:40px;top:34px;max-width:260px}.c.tl b{display:block;font-weight:normal;font-size:30px;letter-spacing:.02em;line-height:1.1;margin-bottom:6px}
</style></head><body>
<div class="c tl"><b>Arda</b>Eight courses, one sitting.<br>Wednesday to Saturday, from seven.<br>&pound;95, wine to follow it &pound;60.</div>
<div id="plate" role="img" aria-live="polite" aria-label="The course on the plate"></div>
<svg id="ring" aria-hidden="true"><defs><path id="orbit"/></defs></svg>
<script src="../round-2/images.js"></script>
<script src="print.js"></script>
<script>
/* no grain here: the ground stays true white so the plates sit on it as cutouts */
/* each course: its name, and the Unsplash photograph its cutout was made from (with the crop used) */
var C = ['Scallop, citrus, hazelnut', 'Artichoke, lemon, thyme', 'Bitter leaves, grilled cheese', 'Spelt, runner beans', 'Turbot, beetroot, parsnip', 'Lobster, morels', 'Lamb, spinach, ink', 'Chocolate, praline, cream'];
var PH = [['photo-1698434939525-dd584e446a29',.39,.5,1.37],['photo-1519077336050-4ca5cac9d64f',.49,.5,1.38],['photo-1669472546359-418a98630699',.5,.5,1.33],['photo-1623695540355-0f4193b51441',.5,.53,1.37],
  ['photo-1519233991914-26a44330ccd7',.5,.52,1.25],['photo-1593854989775-ae5e4d9e49e9',.53,.5,1.3],['photo-1616671276441-2f2c277b8bf9',.47,.53,1.14],['photo-1673912402587-57ac40f1b4a5',.49,.56,1.22]];
function rim(p, w){ return 'https://images.unsplash.com/' + p[0] + '?auto=format&fit=crop&crop=focalpoint&w=' + w + '&h=' + w + '&fp-x=' + p[1] + '&fp-y=' + p[2] + '&fp-z=' + p[3] + '&q=80'; }
var centre = [innerWidth / 2, innerHeight / 2], plate = document.getElementById('plate'), ring = document.getElementById('ring'), idx = -1, texts = [];
/* each dish cut out once along its own plate's rim and saved (img/02), so all eight
   sit on the page's white as the same clean circle, at the same size */
C.forEach(function(c, i){ var im = document.createElement('img'); im.alt = c; im.src = 'img/02/course-' + i + '.webp'; plate.appendChild(im); });
var NS = 'http://www.w3.org/2000/svg';
function layout(){
  var W = innerWidth, H = innerHeight; if (!W) return;
  var blk = document.querySelector('.c.tl').getBoundingClientRect(), pad = 24;
  /* the widest name sets how small the ring's type must be for eight names to keep apart */
  var m = document.createElement('canvas').getContext('2d'); m.font = '100px "Bodoni Moda"';
  var widest = Math.max.apply(null, C.map(function(c){ return m.measureText(c).width / 100; }));
  function fit(d){ var R = d / 2 + Math.max(26, d * 0.09); return { d:d, R:R, fs:Math.min(20, (2 * Math.PI * R / C.length) * 0.84 / widest) }; }
  var cx = W / 2, cy = H / 2, f = fit(Math.min(H * 0.62, W * 0.46)), reach = f.R + f.fs * 1.5;
  /* if the ring would reach the block of facts, the plate moves into the space below it */
  if (cx - reach < blk.right + pad && cy - reach < blk.bottom + pad){
    var top = blk.bottom + pad, avail = H - top - pad;
    cy = top + avail / 2; f = fit(Math.min(W * 0.6, avail * 0.72)); reach = f.R + f.fs * 1.5;
    if (reach * 2 > avail) f = fit(f.d * avail / (reach * 2));
  }
  var d = f.d, R = f.R; centre = [cx, cy];
  document.documentElement.style.setProperty('--d', d + 'px');
  document.documentElement.style.setProperty('--fs', f.fs.toFixed(1) + 'px');
  document.documentElement.style.setProperty('--cx', cx + 'px'); document.documentElement.style.setProperty('--cy', cy + 'px');
  ring.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  /* the ring starts at the top and runs clockwise */
  document.getElementById('orbit').setAttribute('d', 'M ' + cx + ' ' + (cy - R) + ' A ' + R + ' ' + R + ' 0 1 1 ' + (cx - 0.01) + ' ' + (cy - R) + ' Z');
  if (!texts.length) C.forEach(function(c, i){
    var t = document.createElementNS(NS, 'text'), tp = document.createElementNS(NS, 'textPath');
    tp.setAttribute('href', '#orbit'); tp.setAttribute('startOffset', ((i + 0.5) / C.length * 100) + '%'); tp.setAttribute('text-anchor', 'middle'); tp.textContent = c;
    t.appendChild(tp); ring.appendChild(t); texts.push(t);
  });
}
function show(i){
  if (i === idx) return; idx = i;
  [].forEach.call(plate.children, function(im, k){ im.classList.toggle('on', k === i); });
  texts.forEach(function(t, k){ t.classList.toggle('on', k === i); });
}
addEventListener('pointermove', function(e){
  var a = Math.atan2(e.clientY - centre[1], e.clientX - centre[0]) + Math.PI / 2;
  a = (a + Math.PI * 2) % (Math.PI * 2);
  show(Math.floor(a / (Math.PI * 2) * C.length) % C.length);
});
addEventListener('keydown', function(e){ if (e.key === 'ArrowRight') show((idx + 1) % C.length); if (e.key === 'ArrowLeft') show((idx + C.length - 1) % C.length); });
addEventListener('resize', layout);
(function wait(){ if (innerWidth){ layout(); show(0); if (document.fonts) document.fonts.ready.then(layout); } else requestAnimationFrame(wait); })();
</script></body></html>
