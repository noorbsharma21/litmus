<!doctype html>
<meta charset="utf-8">
<title>Contact sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;700;900&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff;font-family:Nunito,sans-serif;padding:26px 30px;width:1440px;box-sizing:border-box}
  h2{font-family:Archivo;font-size:19px;margin:0 0 4px}
  p.l{font-size:14px;color:#666;margin:0 0 18px;max-width:52em}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0 0 30px}
  .cell h3{font-family:Archivo;font-size:13px;margin:0 0 7px;letter-spacing:.04em}
  .cell h3 b{display:inline-block;background:#14130F;color:#fff;padding:2px 7px;margin-right:7px}
  .siteframe{overflow:hidden;border:1px solid #ddd;position:relative;height:300px;background:#fff}
  .siteframe .scaler{position:absolute;top:0;left:0;width:900px;transform-origin:top left}
</style>
<body>
<div id="out"></div>
<script src="data.js"></script>
<script src="references.js"></script>
<script src="palette.js"></script>
<script src="profile.js"></script>
<script src="site.js"></script>
<script src="structure.js"></script>
<script>
function rng(seed){ var x = seed || 1;
  return function(){ x = (x * 1664525 + 1013904223) % 4294967296; return x / 4294967296; }; }

var BASE = { weight:'400', tracking:'0', 'case':'sentence', scale:'34px', measure:'26em',
             leading:'1.5', 'section gap':'30px', ground:'paper', 'how many colours':'2',
             alignment:'left', border:'none' };

function sheet(title, lede, dim, steps, arch, moves){
  var html = '<h2>' + title + '</h2><p class="l">' + lede + '</p><div class="row">';
  steps.forEach(function(st, i){
    var spec = {}; Object.keys(BASE).forEach(function(k){ spec[k] = BASE[k]; });
    spec[dim] = st.v;
    html += '<div class="cell"><h3><b>' + st.n + '</b>' + st.label + '</h3>' +
            renderSite(spec, moves || [], 40 + i * 3, null, arch || 'page') + '</div>';
  });
  return html + '</div>';
}

var out = '';
out += sheet('1. The ground', 'Everything else is held still. Which of these four are out?',
  'ground', [
    {n:'1a', label:'white', v:'white'},
    {n:'1b', label:'paper', v:'paper'},
    {n:'1c', label:'colour', v:'colour'},
    {n:'1d', label:'dark', v:'dark'}
  ]);

out += sheet('2. The border', 'The edge treatment, on a shop so there is something inside it.',
  'border', [
    {n:'2a', label:'none, edge to edge', v:'none'},
    {n:'2b', label:'hairline rule', v:'hairline'},
    {n:'2c', label:'colour field', v:'field'},
    {n:'2d', label:'image mat', v:'mat'}
  ], 'shop');

out += sheet('3. Display scale', 'Same words, four sizes. On a long read, where the headline has to carry.',
  'scale', [
    {n:'3a', label:'22px', v:'22px'},
    {n:'3b', label:'34px', v:'34px'},
    {n:'3c', label:'50px', v:'50px'},
    {n:'3d', label:'72px', v:'72px'}
  ], 'editorial');

out += sheet('4. Case', 'The headline only, on a shop.',
  'case', [
    {n:'4a', label:'lowercase', v:'lower'},
    {n:'4b', label:'sentence case', v:'sentence'},
    {n:'4c', label:'Title Case', v:'Title'},
    {n:'4d', label:'UPPERCASE', v:'UPPER'}
  ], 'shop');

out += sheet('5. Line length', 'How wide the text runs before it wraps. On a long read.',
  'measure', [
    {n:'5a', label:'18em, narrow', v:'18em'},
    {n:'5b', label:'26em', v:'26em'},
    {n:'5c', label:'34em', v:'34em'},
    {n:'5d', label:'46em, wide', v:'46em'}
  ], 'editorial');

out += sheet('6. Section gap', 'How much air between blocks. On a long read.',
  'section gap', [
    {n:'6a', label:'14px, packed', v:'14px'},
    {n:'6b', label:'30px', v:'30px'},
    {n:'6c', label:'56px', v:'56px'},
    {n:'6d', label:'90px, spread', v:'90px'}
  ], 'editorial');

document.getElementById('out').innerHTML = out;
fitSites();
/* the crop tool reads these, so the layout has to be width independent */
window.SECTIONS = Array.prototype.map.call(document.querySelectorAll('h2'), function(h){
  return Math.round(h.getBoundingClientRect().top + window.scrollY) - 14;
}).concat([document.body.scrollHeight]);
document.title = 'cuts:' + window.SECTIONS.join(',');
</script>
